# The self-training loop's bootstrap (2026-10-21): psq trained once, to convergence, on PeSTO's
# self-play (smithy teacher self-psq-direct hand-crafted, then arena self hand-crafted toward 96 x 1024
# x 1024 positions), with one lambda and the direct blend. A forge as on Lc0's labels, with one lambda
# instead of ten: a fixed teacher, no generations after it. Promoted through the gate against the
# hand-crafted evaluation, it becomes the first teacher of `smithy loop-server loop-psq`.
labels: self

# (780 -> 256) x 2 -> 1, amanda's.
architecture:
  kind: psq
  embedding_dim: 256
  value_head:
    hidden_dim: []

# Lambda is the result's weight: PeSTO is a weak teacher, so its labels are almost the result alone.
label:
  lambda: [0.98]

training:
  # lc0-psq's, field for field.
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 4096
  learning_rate: [3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5]
  warmup_rounds: 1
  patience_rounds: 6

selection:
  depth: 9
  round_robin_pairs: 400
  gate:
    rule: sprt
    elo_d: 35
