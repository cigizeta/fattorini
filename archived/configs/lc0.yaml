# smithy lc0: Lc0's training tars converted into data/lc0/test and data/lc0/train (lc0-converter.md).

# test91, BT4's debug run at 800 visits, hourly tars since 2025-12-20.
url: https://storage.lczero.org/files/training_data/test91/
prefix: training-run2-test91-
# The window's start (the developer, 2026-10-17): January's larger tars first, then forward in date
# order until the cap.
from: 20260101-0000

# Drive is split 5 GB for self-play and 5 GB for Lc0 (the developer, 2026-10-17). data/lc0, test
# and train together, is never taken past this, but by one tar's misprediction.
cap_bytes: 5000000000

# Tars downloaded but not yet converted, on the converting machine's local disk. Downloads pause while staging holds this much, unless it holds nothing.
staging_bytes: 100000000000

# The earliest tars, whole, until this many games: the test set smithy freeze draws from.
test:
  games: 65536

# A segment closes at the first game boundary past this many positions, as self-play's.
segment: 1000000
