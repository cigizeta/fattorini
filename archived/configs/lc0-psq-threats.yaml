# psq_threats on Lc0's games (labels-lc0.md, lc0-data.md), as lc0-psq is psq's: data/lc0, each
# score Lc0's best_q after an 800-visit search. No teacher and only generation 1: it starts from
# random weights, and its gate is against the hand-crafted evaluation, as every generation 1's.
labels: lc0

# (4876 -> 256) x 2 -> 1, caroline's: psq's rows plus each perspective's own threats.
architecture:
  kind: psq_threats
  embedding_dim: 256
  value_head:
    hidden_dim: []

# As lc0-psq's: 0.05 to 0.95 in steps of 0.1, ten independent runs of which the best is kept, no 1.00.
label:
  lambda: [0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95]

training:
  # lc0-psq's, field for field.
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 4096
  learning_rate: [3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5]
  warmup_rounds: 1
  patience_rounds: 6

selection:
  depth: 9
  round_robin_pairs: 400
  gate:
    rule: sprt
    elo_d: 35
