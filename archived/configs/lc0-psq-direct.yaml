# lc0-psq, field for field, with each label blended with the game's result directly, Lc0's own way
# (2026-10-20): label = (1 - lambda) * score + lambda * result, nothing in between. AB(lambda) blends
# through every later score of the game, so Lc0's temperature moves push their drops backward;
# lc0-psq-zero, lambda 0, had the lowest loss yet lost its duel against lc0-psq-0001-0.15, so some of the
# result helps. The question: does the result help more once it arrives without the chain's noise?
labels: lc0

# (780 -> 256) x 2 -> 1, amanda's.
architecture:
  kind: psq
  embedding_dim: 256
  value_head:
    hidden_dim: []

# lc0-psq's ten lambdas, so the three selects compare lambda by lambda.
label:
  lambda: [0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95]

training:
  # lc0-psq's, field for field.
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 4096
  learning_rate: [3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5]
  warmup_rounds: 1
  patience_rounds: 6

selection:
  depth: 9
  round_robin_pairs: 400
  gate:
    rule: sprt
    elo_d: 35
