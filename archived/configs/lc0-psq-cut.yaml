# lc0-psq, field for field. It was AB(lambda) cut at Lc0's costly non-best moves (2026-10-19): the
# cut gave every ply whose move played was not its best, and after which the mover's evaluation fell
# by more than 0.10, its own score as label. AB(lambda) and its cut were retired on 2026-10-22, and
# every label is now the direct blend, so this config now trains as lc0-psq-direct does; its
# networks trained the old way stay playable from their .nnue.
labels: lc0

# (780 -> 256) x 2 -> 1, amanda's.
architecture:
  kind: psq
  embedding_dim: 256
  value_head:
    hidden_dim: []

# lc0-psq's ten lambdas, so the two selects compare lambda by lambda.
label:
  lambda: [0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95]

training:
  # lc0-psq's, field for field.
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 4096
  learning_rate: [3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5]
  warmup_rounds: 1
  patience_rounds: 6

selection:
  depth: 9
  round_robin_pairs: 400
  gate:
    rule: sprt
    elo_d: 35
