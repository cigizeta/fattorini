# Self-play only from generation 2 (2026-10-17): the teacher's games in data/self, streamed by forge.
labels: self

# Caroline: psq_threats with no hidden layer, psq's rows plus each perspective's own threats (a row
# for every square pair where an own piece attacks an opponent piece). Amanda's architecture plus the
# threats, as dorothy is betty's plus the threats: the four, on one dataset, cross the hidden layer
# with the threats. No preprocessing section: an NNUE network trains on self-play games only.
#
# Her generation 1 is taught by amanda-0002, on the data amanda's and betty's generation 3 train on,
# not by the hand-crafted evaluation: so the four compare on equal terms from the start. (Caroline
# was once a psq lineage trained on the hand-crafted corpus, since retired; she restarts here.)
#
# (4876 -> 256) x 2 -> 1: psq's 780 rows and 4,096 threat rows through one shared transform of width
# 256, amanda's, so a threat and the pieces on its squares meet before the activation; concatenated
# to 512, straight to the output. The piece-square part is updated incrementally, the threat part
# recomputed at every evaluation.
architecture:
  kind: psq_threats
  embedding_dim: 256
  value_head:
    hidden_dim: []

# 0.95 to 1.00, as betty's (the developer, 2026-10-16): amanda's round robins never ranked 0.90 to
# 0.94 near the top. 1.00 ignores the teacher's scores entirely: it is the canary, never promoted,
# its winning a red flag. If 0.95 ever wins, the grid widens again.
label:
  lambda: [0.95, 0.96, 0.97, 0.98, 0.99, 1.00]

training:
  # Amanda's, field for field, so the four differ in the architecture alone.
  #
  # The training fields are read-only once a run has started: the cursor and the round boundary are
  # derived from the step count, so the first invocation freezes them in run_config.txt and a later
  # one that disagrees is refused.
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 1024
  # 2^21 positions resident in front of the cyclic read -- about 200 MB: 512 batches' worth.
  # Trained in data/networks/caroline/gen-NNNN/ from the first rate, after one warmup round, moving
  # abruptly to the next rate once 5 rounds pass without a new best test loss, and stopping when the
  # last rate runs out of patience. The best checkpoint of the whole run is the generation's
  # challenger.
  learning_rate: [3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5]
  warmup_rounds: 1
  patience_rounds: 5

# As amanda's: a round robin among the lambdas' candidates, then the gate against the champion (for
# generation 1, the hand-crafted evaluation). The round robin at one fixed depth, the gate at 10+0.1.
selection:
  depth: 9
  # Colour-reversed game pairs between every two candidates: 400 pairs, 800 games a pairing, 4,000
  # a lambda over its 5 opponents (about +/-1.25%); 15 pairings, 12,000 games in all. Closer lambdas
  # are interchangeable.
  round_robin_pairs: 400
  # The challenger promotes only when an SPRT shows it at least 35 Elo stronger than the champion.
  gate:
    rule: sprt
    elo_d: 35
