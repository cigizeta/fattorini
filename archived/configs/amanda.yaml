# Its teacher's self-play games, streamed, since generation 3 was decided on the archives.
labels: self

# No preprocessing section: an NNUE network trains on self-play games only, and every lineage starts
# from the hand-crafted evaluation's.
#
# (780 -> 256) x 2 -> 1: 768 piece-square rows plus castling rights and the en passant file, seen
# from both sides through one shared transform of width 256, concatenated to 512, straight to the
# output. Built for an incremental accumulator.
architecture:
  kind: psq
  embedding_dim: 256
  value_head:
    hidden_dim: []

# Generation 2, redone on betty's grid (2026-10-11): 0.90 to 1.00 in steps of 0.01. Its first
# grid, 0.60 to 1.00 in steps of 0.05, rose with lambda up to 0.95 and 1.00, level at the top; on
# one grid, amanda and betty differ in the hidden layer alone. Generation 1's lineages won at 0.95,
# the top of their grids (a label averaging the teacher's scores over about 20 plies ahead). 1.00
# labels every position with the game's result alone, ignoring the teacher's scores: it is the
# canary, never promoted, its winning a red flag.
label:
  lambda: [0.90, 0.91, 0.92, 0.93, 0.94, 0.95, 0.96, 0.97, 0.98, 0.99, 1.00]

training:
  # From generation 2, betty's recipe (the retired caroline's, sized for the whole new corpus), so
  # the two train alike on one corpus and differ in the hidden layer alone.
  #
  # The training fields are read-only once a run has started: the cursor and the round boundary are
  # derived from the step count, so the first invocation freezes them in run_config.txt and a later
  # one that disagrees is refused.
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 1024
  # 2^21 positions resident in front of the cyclic read -- about 200 MB: 512 batches' worth.
  # Trained in data/networks/amanda/gen-NNNN/ from the first rate, after one warmup round, moving
  # abruptly to the next rate once 5 rounds pass without a new best test loss, and stopping when the
  # last rate runs out of patience. The best checkpoint of the whole run is the generation's
  # challenger. `smithy promote` makes it the champion, and the next generation starts from its
  # weights.
  # No 1e-5 stage from generation 2 on: in generation 1 it gained a third of what 3e-5 did, at full
  # cost.
  learning_rate: [3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5]
  warmup_rounds: 1
  patience_rounds: 5

# The generation's challenger is the winner of a round robin among the lambdas' candidates, ranked by
# points; then it plays the champion, and only its win promotes. The round robin at one fixed depth,
# so every core can play a game at once without weakening any player; the gate at 10+0.1, the
# control its margin was tuned at.
selection:
  depth: 9
  # Colour-reversed game pairs between every two candidates: 100 pairs, 200 games, resolve gaps of
  # about 25 Elo; closer lambdas are interchangeable.
  round_robin_pairs: 100
  # The challenger promotes only when an SPRT shows it at least 35 Elo stronger than the champion.
  gate:
    rule: sprt
    elo_d: 35
