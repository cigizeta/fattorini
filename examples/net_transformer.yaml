label:
  lambda: [0.95]

architecture:
  kind: transformer
  embedding_dim: 256
  num_layers: 6
  num_heads: 8
  feedforward_dim: 1024
  dropout: 0.1
  value_head:
    hidden_dim: [128, 64]

training:
  attention: full   # full | kings-only
  learning_rate: 1.0e-4
  training_batch_size: 1024
  test_batch_size: 16384
  steps_per_round: 8192
  warmup_rounds: 1
  patience_rounds: 5
