# The engine registry, an example. Copy it to data/engines.yaml, which is gitignored and per machine,
# and set each path to the executable on this machine. Paths use forward slashes in double quotes:
# in a double-quoted YAML string a backslash starts an escape.
#
# Every entry is a UCI engine the arena can play by its name (`./bin/arena duel reckless self-psq-0001
# --time 10+0.1`), with `options` sent to it. Hash, Threads and SyzygyPath are always set by the arena
# over whatever an entry says, so both sides of a match play on equal footing.
#
# `stockfish` is special: it only says where Stockfish is. The players stockfish-<level> and
# stockfish-elo-<rating> run it with their handicap; Stockfish at full strength is stockfish-20.
# A name a built-in player has (pesto, stockfish-..., <run>-NNNN) is refused.
engines:
  # Stockfish installed with `winget install Stockfish.Stockfish`; replace <you> with the Windows user.
  stockfish:
    path: "C:/Users/<you>/AppData/Local/Microsoft/WinGet/Packages/Stockfish.Stockfish_Microsoft.Winget.Source_8wekyb3d8bbwe/stockfish/stockfish-windows-x86-64-universal.exe"

  # Any other UCI engine, downloaded by hand.
  # reckless:
  #   path: "C:/engines/reckless/reckless.exe"
  #   options:
  #     Move Overhead: 50
