# The licenses `cargo-about` accepts when it writes a binary release's notices (`about.hbs`): every
# license in `kalo-chess.exe`'s own dependency tree, all compatible with AGPLv3. A crate under any other
# license stops the generation, to be judged before it ships.
accepted = [
    "GPL-3.0-or-later",
    "GPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
]

# Only the release's target, and only what is built into the `.exe`: `pgn-reader` and `zstd` are
# the engine's dev-dependencies, for its benches.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Kalo Chess itself (`publish = false`): its own license is `LICENSE`, not a third-party notice.
private = { ignore = true }
