[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"

# Dead code is never tolerated: every build fails on it, the `bin/` wrappers' included. Not every
# warning: a new toolchain's lint would then break the build. A `pub` item of a library is never
# reported, so `fattorini::pipeline` holds only the contract both tools use.
[workspace.lints.rust]
dead_code = "deny"
unused = "deny"
non_shorthand_field_patterns = "deny"

# The versions every crate shares. Why each crate needs a dependency is said where it uses it.
[workspace.dependencies]
fattorini = { path = "crates/fattorini" }
pgn-replay = { path = "crates/pgn-replay" }
progress = { path = "crates/progress" }
lan-http = { path = "crates/lan-http" }
ctrlc = "3.5.2"
# `smithy start` and `arena start` log their events to stdout (`progress::log_events`); no regex filter.
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
flate2 = "1"
log = "0.4"
num_enum = "0.7.6"
pgn-reader = "0.29"
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shakmaty = "0.30"
time = "0.3"
tiny_http = "0.12"
# Plain HTTP on the LAN only: no TLS stack (`lan-http`).
ureq = { version = "2.12", default-features = false }
zstd = { version = "0.13", features = ["zstdmt"] }
windows-sys = "0.61"
