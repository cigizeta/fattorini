# lc0-halfk-threats-pairwise-hidden with gentler rate steps (2026-11-17): the same network, corpus and
# forge, its learning rates from 3e-3 to 3e-5 in steps of about 0.7 instead of about 0.3, with a
# patience of 3 rounds instead of 6. An A/B of the schedule alone, against
# lc0-halfk-threats-pairwise-hidden's run 1, trained only if pairwise wins the halfk line: in
# lc0-halfk-threats-screlu's run 2, each rate kept training long after its gains had become small,
# noise renewing its best. Differs from lc0-halfk-threats-pairwise-hidden by learning_rate and
# patience_rounds alone.

# The forge. Lambda by progress: each generation trains one arm, each position labelled at the
# polyline measured on its corpus.
lambda: polyline
# From generation 2 on: 1024 x 1024 x 1024 training positions a generation plays, once: a failed
# gate ends the run. Generation 1's are Lc0's corpus (lc0.yaml).
training_positions: 1073741824
# From generation 2 on: 4 x 1024 x 1024, each teacher's frozen test set. Generation 1's is lc0.yaml's.
test_positions: 4194304
round_robin_pairs: 400
gate_elo_d: 35

# The tune of each generation that passed its gate, started by hand, at 10+0.1: the default
# length, 32,768 pairs, from its teacher's tune (generation 1's from the defaults); the next
# generation's self-play plays it.
tune:
  length: default
  control: 10+0.1

# The network: (26636 -> 256) x 2, each perspective's halves multiplied, -> 16 -> 32 -> 1; in
# training 27340 rows, halfk's, the factor's, then the 12 castling and en passant rows.
labels: lc0

architecture:
  kind: halfk_threats_pairwise_hidden
  embedding_dim: 256
  value_head:
    hidden_dim: [16, 32]

training:
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 4096
  # 3e-3 times 0.7 to the n, rounded to two digits, the last one 3e-5 as before.
  learning_rate: [3.0e-3, 2.1e-3, 1.5e-3, 1.0e-3, 7.2e-4, 5.0e-4, 3.5e-4, 2.5e-4, 1.7e-4, 1.2e-4, 8.5e-5, 6.0e-5, 4.2e-5, 3.0e-5]
  warmup_rounds: 1
  patience_rounds: 3
