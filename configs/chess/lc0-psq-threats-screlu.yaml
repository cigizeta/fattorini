# The Lc0 route, psq_threats_screlu (2026-10-24, lc0-psq-threats with the accumulator squared after
# its clipped ReLU). Generation 1 trains on Lc0's labels, about 1B positions, direct blend, one arm
# at the lambda polyline (2026-11-04, replacing nine lambdas centred at 0.05); it is gated against
# PeSTO, as a sanity check, once. From generation 2 on, self-play, as
# pesto-psq-threats-screlu. The psq line's reference network (2026-11-03), the line's other configs
# archived; differed from lc0-psq-threats by the square alone.

# The forge. Lambda by progress: each generation trains one arm, each position labelled at the
# polyline measured on its corpus. The grid it replaces centred generation 1 on 0.05.
lambda: polyline
# From generation 2 on: 1024 x 1024 x 1024 training positions a generation plays, once: a failed
# gate ends the run (2026-11-02; emily's generation 2 passed at 4 x 96 x 1024 x 1024). Generation
# 1's are Lc0's corpus (lc0.yaml).
training_positions: 1073741824
# From generation 2 on: 4 x 1024 x 1024, each teacher's frozen test set. Generation 1's is lc0.yaml's.
test_positions: 4194304
round_robin_pairs: 400
gate_elo_d: 35

# The tune of each generation that passed its gate, started by hand, at 10+0.1: the default
# length, 16,384 pairs, every one from the default parameters.
tune:
  length: default
  control: 10+0.1

# The network: (4876 -> 256) x 2 -> 1, caroline's, each lane squared after the clip.
labels: lc0

architecture:
  kind: psq_threats_screlu
  embedding_dim: 256
  value_head:
    hidden_dim: []

training:
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 4096
  learning_rate: [3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5]
  warmup_rounds: 1
  patience_rounds: 6
