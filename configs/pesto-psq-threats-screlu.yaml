# The PeSTO route, psq_threats_screlu (2026-11-03, the identity line, replacing pesto-psq): the psq
# line's reference network, as lc0-psq-threats-screlu. Generation 1 trains on PeSTO's corpus
# (pesto.yaml), gated against PeSTO; from generation 2 on, each generation plays its training set
# with the previous winner, trains its one polyline arm to convergence and gates it against its
# teacher.

# The forge. Lambda by progress (2026-11-04, the polyline experiment): each generation trains one
# arm, each position labelled at the polyline measured on its corpus, straight to the gate. The grid
# it replaces centred generation 1 on 0.95.
lambda: polyline
# From generation 2 on: 1024 x 1024 x 1024 training positions a generation plays, once: a failed
# gate ends the run. Generation 1's are pesto.yaml's.
training_positions: 1073741824
# From generation 2 on: 4 x 1024 x 1024, each teacher's frozen test set. Generation 1's is pesto.yaml's.
test_positions: 4194304
round_robin_pairs: 400
gate_elo_d: 35

# The tune of each generation that passed its gate, started by hand, at 10+0.1: the default
# length, 32,768 pairs, from its teacher's tune (generation 1's from PeSTO's); the next
# generation's self-play plays it.
tune:
  length: default
  control: 10+0.1

# The network: (4876 -> 256) x 2 -> 1, each lane squared after the clip.
labels: pesto

architecture:
  kind: psq_threats_screlu
  embedding_dim: 256
  value_head:
    hidden_dim: []

# Rates 3e-3 to 3e-5, patience 6 rounds of 4096 steps of 4096 positions.
training:
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 4096
  learning_rate: [3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5]
  warmup_rounds: 1
  patience_rounds: 6
