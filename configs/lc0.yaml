# Lc0's source: its Convert job, from the smithy's page, converts Lc0's training tars into
# data/chess/lc0/test and data/chess/lc0/train on Drive, once, for every `lc0-` config.

# 4 x 1024 x 1024: the frozen test set every `lc0-` run's generation 1 is judged on, drawn from
# the corpus's test/.
test_positions: 4194304

# test91, BT4's debug run at 800 visits, hourly tars since 2025-12-20.
url: https://storage.lczero.org/files/training_data/test91/
prefix: training-run2-test91-
# The window's start (the developer, 2026-10-17): January's larger tars first, then forward in date
# order until the cap.
from: 20260101-0000

# 24 GiB (the developer, 2026-10-31, from 32 GiB on 2026-10-29): each comment carries every legal
# move's visit counts, about 4.4 times the bytes a position, so the corpus grows past the old 5 GB's
# games. At about 21.5 bytes a position, about
# 1.2 billion positions: every tar of the old corpus (about 1.0 billion, about 20.5 GiB here) and a
# fifth more. The corpus, test and train together, is never taken past this, but by one tar's
# misprediction.
cap_bytes: 25769803776

# Tars downloaded but not yet converted, on the converting machine's local disk. Downloads pause while staging holds this much, unless it holds nothing.
staging_bytes: 100000000000

# The earliest tars, whole, until this many games: the test set smithy freeze draws from.
test:
  games: 65536

# A segment closes at the first game boundary past this many positions, as self-play's.
segment: 1000000
