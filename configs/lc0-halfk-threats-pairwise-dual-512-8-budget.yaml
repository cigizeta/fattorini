# lc0-halfk-threats-pairwise-hidden-512-8-budget with a dual head (2026-11-25): pairwise on the
# transform, where it saves the most, and screlu's squaring after the first hidden layer, where it
# costs the least. Of the first layer's 16 outputs, 15 are clipped and passed on both as they are
# and squared (CReLU and SCReLU, 30 values) into the second layer; the 16th, raw, is added to the
# output, a shortcut. Its test loss compares round by round with the pairwise attempt's and the
# screlu-hidden one's (the same corpus and schedule); its duels against both, on the engine optimized
# for both kinds.

# The forge. Each generation trains one run, each position labelled at the polyline measured on its
# corpus.
# From generation 2 on: 1024 x 1024 x 1024 training positions a generation plays, once: a failed
# gate ends the attempt. Generation 1's are Lc0's corpus (lc0.yaml).
training_positions: 1073741824
# From generation 2 on: 4 x 1024 x 1024, each teacher's frozen test set. Generation 1's is lc0.yaml's.
test_positions: 4194304
# Pairs a pairing of the round robin, a grid's lambdas or a budget's checkpoints: for nine, 6,400
# games a candidate, 28,800 in all.
round_robin_pairs: 400
gate_elo_d: 35

# The tune of each generation that passed its gate, started by hand, at 10+0.1: the default
# length, 32,768 pairs, from its teacher's tune (generation 1's from the defaults); the next
# generation's self-play plays it.
tune:
  length: default
  control: 10+0.1

# The network: (9740 -> 512) x 2, each perspective's halves multiplied, -> 16; 15 of them clipped
# and squared -> 30 -> 32 -> 1, plus the 16th; in training 10444 rows, halfk's, the factor's, then
# the 12 castling and en passant rows.
# The networks' unit: Elo's, files of format version 3.
unit: elo
labels: lc0

architecture:
  kind: halfk_threats_pairwise_dual
  king_buckets: 8
  embedding_dim: 512
  value_head:
    # The first width counts the shortcut: 15 values and the 16th.
    hidden_dim: [16, 32]

training:
  training_batch_size: 8192
  test_batch_size: 16384
  steps_per_round: 4096
  # From 1e-3 to 1e-5, as at batch 4096: the rate is chosen regardless of the batch.
  epochs: 4
  learning_rate: [1.0e-3, 1.0e-5]
  warmup_rounds: 1
