# The alpha_pieces transformer on Lc0's corpus, value head only (2026-11-18):
# trained exactly as the NNUEs are, on the scattered buckets grouped by piece count, labelled by the
# polyline, under the fixed budget, judged on the same frozen test set. Compared with an NNUE by
# test loss alone: the engine cannot play a transformer, so the run ends at its training, with no
# round robin, no gate and no tune. A scaled run first, its scale chosen at New run, beside an NNUE
# baseline at the same scale.

# The forge. Lambda by progress, as every budgeted run: one arm, labelled at the polyline measured
# on its corpus.
lambda: polyline
# Unused by a transformer, which plays no game; required by the forge, and kept as the budgeted
# NNUE configs have them.
training_positions: 1073741824
test_positions: 4194304
round_robin_pairs: 400
gate_elo_d: 35
tune:
  length: default
  control: 10+0.1

labels: lc0

# A small shape to start (width 64, 4 layers): [CLS] and one token per piece, 4 heads, the
# feed-forward part 4 times the width, dropout while training only, and a value head reading [CLS]
# through one hidden layer of 32.
architecture:
  kind: transformer
  embedding_dim: 64
  num_layers: 4
  num_heads: 4
  feedforward_dim: 256
  dropout: 0.1
  value_head:
    hidden_dim: [32]

training:
  attention: full
  # The budgeted NNUEs' batches and rounds, so the losses are compared at the same steps.
  training_batch_size: 4096
  test_batch_size: 16384
  steps_per_round: 4096
  # The budgeted NNUEs' schedule: 4 passes, the rate falling geometrically from 1e-3 to 1e-5. A pass
  # is the full batches of one piece count, a count's partial batch dropped each epoch.
  schedule: budget
  epochs: 4
  learning_rate: [1.0e-3, 1.0e-5]
  warmup_rounds: 1
