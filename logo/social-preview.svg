<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- GitHub's social preview: logo-light-large.svg centred on its own cream, 1280x640. GitHub takes
       no SVG there, so this is rendered to social-preview.png, which is uploaded by hand. The
       drawing is copied in, not referenced: a referenced file is not loaded by every renderer (a
       browser opening this from disk, for one), and every renderer must draw a logo file the same. -->
  <rect x="0" y="0" width="1280" height="640" fill="#f4efe2"/>
  <svg x="370" y="100" width="540" height="440" viewBox="4 -24 240 196">
    <style>
      .bg { fill: #f4efe2; }
      .frame { fill: #2f4a3a; } .frame-line { stroke: #2f4a3a; }
      .dial { fill: #fffdf7; stroke: #2f4a3a; }
      .ink { stroke: #2f4a3a; } .ink-dot { fill: #2f4a3a; }
      .base { fill: #b8893b; }
    </style>
    <defs>
      <g id="clock">
        <path class="frame-line" d="M0 -42 L-38 -16 L-27 42 L27 42 L38 -16 Z" fill="none" stroke-width="7" stroke-linejoin="round"/>
        <circle class="frame" cx="0" cy="-44" r="6"/>
        <circle class="frame" cx="-40" cy="-16" r="6"/>
        <circle class="frame" cx="40" cy="-16" r="6"/>
        <circle class="dial" cx="0" cy="6" r="24" stroke-width="6"/>
      </g>
      <g id="numerals" class="ink" fill="none" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-3.2 -19 L0.4 -13 M0.4 -19 L-3.2 -13 M1.8 -19 V-13 M3.2 -19 V-13"/>
        <path d="M14.4 -3 V3 M16 -3 V3 M17.6 -3 V3"/>
        <path d="M-2.5 13 L-0.7 19 L1.1 13 M2.5 13 V19"/>
        <path d="M-18.5 -3 V3 M-17.1 -3 L-13.5 3 M-13.5 -3 L-17.1 3"/>
      </g>
    </defs>
    <rect class="bg" x="4" y="-24" width="240" height="196" rx="20"/>
    <rect class="base" x="44" y="138" width="152" height="18" rx="9"/>
    <path class="frame" d="M120 104 L104 140 L136 140 Z"/>
    <g transform="rotate(7 120 102)">
      <g transform="rotate(-8 120 102)">
        <use href="#clock" x="75" y="56"/>
        <use href="#numerals" x="75" y="62"/>
        <rect class="frame" x="28" y="96" width="98" height="12" rx="6"/>
        <path class="ink" d="M75 62 L75 50 M75 62 L66.6 58.8" stroke-width="3" stroke-linecap="round"/>
        <circle class="ink-dot" cx="75" cy="62" r="2.5"/>
      </g>
      <g transform="rotate(8 120 102)">
        <use href="#clock" x="165" y="56"/>
        <use href="#numerals" x="165" y="62"/>
        <rect class="frame" x="114" y="96" width="98" height="12" rx="6"/>
        <path class="ink" d="M165 62 L165 50 M165 62 L172.9 66.3" stroke-width="3" stroke-linecap="round"/>
        <circle class="ink-dot" cx="165" cy="62" r="2.5"/>
      </g>
    </g>
  </svg>
</svg>
