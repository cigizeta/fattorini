<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fattorini smithy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,FAVICON_LIGHT">
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --panel: #ffffff;
    --accent: #2563eb; --good: #15803d; --bad: #b91c1c;
    /* A new best, as the terminal's bold green (Windows Terminal's ANSI green). */
    --best: #13a10e;
    /* The loss chart's training line, apart from the test line's accent blue. */
    --train: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --fg: #e7e5e4; --muted: #a8a29e; --line: #2e2c2a; --panel: #1c1b1a;
      --accent: #60a5fa; --good: #4ade80; --bad: #f87171;
      --best: #4ade80;
      --train: #fbbf24;
    }
  }
  /* The polyline's loss chart: SVG drawn in the page's colors, scaled to the box's width. */
  .chart { display: block; max-width: 100%; height: auto; margin-top: 12px; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart .axis { stroke: var(--muted); stroke-width: 1; }
  .chart .stage { stroke: var(--line); stroke-width: 1; }  .chart .test { fill: none; stroke: var(--accent); stroke-width: 2; }
  .chart .train { fill: none; stroke: var(--train); stroke-width: 1.25; }
  .chart .best { fill: var(--best); }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  .sub .bad { color: var(--bad); }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 14px; overflow-x: auto;
  }
  /* As wide as its content, so each header sits over its own numbers. */
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 0 auto; }
  th, td { text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { text-align: center; }
  th:first-child, td:first-child { text-align: left; }
  /* A tune's table: what each parameter does, as prose, beside its numbers. */
  table.tune td:nth-child(2) { text-align: left; font: inherit; color: var(--muted, inherit); }
  /* Cells in the terminal's font, so columns align and bold costs no width; headers stay sans. */
  td { font: 13px ui-monospace, "Cascadia Mono", Consolas, monospace; }
  td .loss, td .share, td .margin { display: inline-block; }
  td .share { min-width: 6ch; text-align: right; }
  td .margin { min-width: 7ch; text-align: right; }
  td .loss.fresh { color: var(--best); font-weight: 700; }
  th { color: var(--muted); font-weight: 600; }
  /* A phone's training box, held upright (the developer, 2026-11-27): learning rate, best loss and
     round alone, train and test loss left to the chart below; tighter cells, so it never scrolls. */
  @media (max-width: 600px) {
    table.training th, table.training td { padding: 4px 6px; }
    /* A phone's trials' log: trial, what and verdict alone (the developer, 2026-11-27). */
    .log th, .log td { padding: 4px 6px; }
    .log th:nth-child(2), .log td:nth-child(2), .log th:nth-child(4), .log td:nth-child(4),
    .log th:nth-child(5), .log td:nth-child(5), .log th:nth-child(6), .log td:nth-child(6) { display: none; }
    .log table td:nth-child(7) { min-width: 0; }
    /* A phone's trial screen: games and results alone (the developer, 2026-11-27). */
    table.trial th:nth-child(n+3), table.trial td:nth-child(n+3) { display: none; }
    /* A phone's round robin: rank, candidate and score alone (the developer, 2026-11-27). */
    table.standings th, table.standings td { padding: 4px 6px; }
    table.standings th:nth-child(3), table.standings td:nth-child(3),
    table.standings th:nth-child(4), table.standings td:nth-child(4) { display: none; }
    table.training th:nth-child(2), table.training td:nth-child(2),
    table.training th:nth-child(3), table.training td:nth-child(3) { display: none; }
  }
  /* The trials' log fits the page: its long cells (what was played, the verdict) wrap, never scroll. */
  .log table { width: 100%; }
  .log td { white-space: normal; vertical-align: top; }
  .log td:nth-child(3), .log td:nth-child(7) { min-width: 18ch; text-align: left; }
  .log td:first-child { white-space: nowrap; }
  /* A trial's number right-aligned in a slot of its own, so 9 sits under 10's units and the buttons
     after it stay in one column. */
  .log .number { display: inline-block; min-width: 3ch; text-align: right; }
  tr:last-child td { border-bottom: none; }
  .bar { display: flex; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
  .bar > div { height: 100%; background: var(--accent); }
  /* The accent at 40%, over the track: a lighter blue on the light theme, a dimmer one on the dark. */
  .bar > div.tentative { opacity: 0.4; }
  .gauge { display: flex; align-items: center; gap: 10px; max-width: 520px; margin: 4px auto 12px; }
  .gauge .end { color: var(--muted); font-size: 13px; }
  .gauge .track { position: relative; flex: 1; height: 8px; background: var(--line); border-radius: 4px; }
  .gauge .zero { position: absolute; top: -3px; width: 2px; height: 14px; margin-left: -1px; background: var(--muted); }
  .gauge .mark { position: absolute; top: -4px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--accent); }
  .gauge .mark.failed { background: var(--bad); }
  .gauge .mark.passed { background: var(--good); }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  form { display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row > label:first-child { min-width: 96px; color: var(--muted); }
  input, select, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input[type="radio"] { padding: 0; }
  button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; padding: 6px 14px; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.plain { background: var(--bg); border-color: var(--line); color: var(--fg); }
  /* A clock preset reads as a link, not as a field: it fills the fields beside it. */
  button.preset { background: none; border: none; color: var(--accent); padding: 0; text-decoration: underline; }
  .hidden { display: none; }
  .row h2 { margin: 0; }
  .attempt { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .attempt:last-of-type { border-bottom: none; }
  .tunes { padding-left: 24px; margin-top: 6px; display: grid; gap: 6px; }
  .newattempt { margin-top: 12px; }
  section.current { border-color: var(--accent); }
  #viewBody section { border: none; padding: 8px 0 0; margin: 0; }
  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .box {
    display: block; text-align: left; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; cursor: pointer; font: inherit;
  }
  .box:hover { border-color: var(--accent); }
  .box.running { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .box b { display: block; font-size: 15px; margin-bottom: 4px; }
  .box .tag { color: var(--accent); font-weight: 600; }
  .head { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .head h1 { margin: 0; }
  /* The logo beside every view's title, the small one, its colouring the page's theme's. */
  .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 4px; }
  .brand h1 { margin: 0; }
  .head .brand { margin-bottom: 0; }
  .logo { width: 40px; height: 40px; }
  .logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .logo-cream { display: none; }
    .logo-dark { display: block; }
  }
</style>
</head>
<body>
<main>
  <div id="home">
    <div class="brand">
      <img class="logo logo-cream" alt="" src="data:image/svg+xml,FAVICON_LIGHT">
      <img class="logo logo-dark" alt="" src="data:image/svg+xml,FAVICON_DARK">
      <h1>Fattorini smithy</h1>
    </div>
    <div class="sub" id="sub">waiting for the smithy</div>
    <section class="live hidden"></section>
    <div id="boxes"></div>
    <div id="arenas"></div>
  </div>
  <div id="page" class="hidden">
    <div class="head">
      <div class="brand">
        <img class="logo logo-cream" alt="" src="data:image/svg+xml,FAVICON_LIGHT">
        <img class="logo logo-dark" alt="" src="data:image/svg+xml,FAVICON_DARK">
        <h1 id="pageTitle"></h1>
      </div>
      <button class="plain" id="back">Back</button>
    </div>
    <div class="sub" id="pageSub"></div>
    <section class="live hidden"></section>
    <section id="job" class="hidden"></section>
    <section id="work" class="hidden"></section>
    <div id="forge"></div>
    <div id="config"></div>
    <section id="view" class="hidden"><div id="viewHead"></div><div id="viewBody"></div></section>
  </div>
</main>
<script>
"use strict";
const escape = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// Blank for a value the state sends as null: a `NaN`, as round 0's train loss, which has none.
const number = (value, digits) => value === null ? "" : value.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
const whole = (value) => value.toLocaleString();
const percent = (value) => number(100 * value, 1) + "%";
// A trial's time in the viewer's own zone, as `YYYY-MM-DD HH:MM CET` (the developer, 2026-11-27),
// from the record's `YYYY-MM-DD HH:MM UTC`; anything else as it is. The log's and a trial's alike.
const local = (text) => {
  const parts = /^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d) UTC$/.exec(text || "");
  if (!parts) return text;
  const when = new Date(Date.UTC(+parts[1], parts[2] - 1, +parts[3], +parts[4], +parts[5]));
  const pad = (n) => String(n).padStart(2, "0");
  const zone = new Intl.DateTimeFormat("en-GB", { timeZoneName: "short" }).formatToParts(when)
    .find((p) => p.type === "timeZoneName");
  return `${when.getFullYear()}-${pad(when.getMonth() + 1)}-${pad(when.getDate())} `
    + `${pad(when.getHours())}:${pad(when.getMinutes())}${zone ? " " + zone.value : ""}`;
};

// `done` of `total` in the accent; with `reached`, the stretch from `done` to it lighter, progress
// that may still be taken back.
function bar(done, total, reached = done) {
  const width = (value) => total > 0 ? Math.min(100, 100 * value / total) : 0;
  const tentative = width(reached) - width(done);
  return `<div class="bar"><div style="width:${width(done)}%"></div>`
    + (tentative > 0 ? `<div class="tentative" style="width:${tentative}%"></div>` : "") + `</div>`;
}

// Every bar moves at every redraw, not only when a result arrives (the developer, 2026-11-26): it
// shows what is done plus an estimate of the part under way, which never reaches the next real step,
// so it never overshoots nor steps back when the result comes. The count in the text stays whole, a
// fact; the percent and the ETA follow the bar. A training bar takes the round under way's live share
// (`budgetProgress`); a bar of games, which say nothing until they end, estimates by time:
// `underWay` below, capped at the work in play (`inPlay`).

// When each game bar's count last changed, by its place: the page's own clock, so no server field; a
// reload starts it at zero, the bar under-estimating for a moment, never overshooting.
const countChanged = new Map();

// The part under way of the bar at `key`, whose count is `count`: the seconds since that count last
// changed at `perSecond` units a second, capped at `cap`, the units in play; 0 without a pace.
function underWay(key, count, perSecond, cap) {
  const now = performance.now();
  const seen = countChanged.get(key);
  if (!seen || seen.count !== count) {
    countChanged.set(key, { count, at: now });
    return 0;
  }
  if (!perSecond || perSecond <= 0 || cap <= 0) return 0;
  return Math.min(cap, (now - seen.at) / 1000 * perSecond);
}

// Tasks the arenas' workers are playing, from each one's last poll: a pair each for trials, tunes
// and round robins, a game for self-play.
function inPlay() {
  return (state.arenas || []).reduce((sum, a) => sum + (a.in_play || 0), 0);
}

// The ETA of a bar at `position` of `total` at `perSecond`, as `times` words it; none without a pace
// or with nothing left.
function etaAt(position, total, perSecond) {
  return perSecond && perSecond > 0 && total - position > 0 ? `, ETA about ${duration(Math.round((total - position) / perSecond))}` : "";
}

// The gate's progress, which no count of games can give, an SPRT ending whenever its evidence is
// enough: its LLR marked between the fail bound, left, and the pass bound, right, a tick where it starts.
// Once a bound is reached the mark takes the verdict's colour, red failed and green passed. A duel's
// gauge, whose ends are its two players, is given its `won` instead: green the challenger, red the
// champion, the accent while undecided or drawn.
function gauge(llr, lower, upper, left = "fail", right = "pass", tick = 0, won = null) {
  const at = (value) => 100 * Math.min(1, Math.max(0, (value - lower) / (upper - lower || 1)));
  const verdict = left === "fail" && right === "pass" ? (llr <= lower ? " failed" : llr >= upper ? " passed" : "")
    : won === "challenger" ? " passed" : won === "champion" ? " failed" : "";
  return `<div class="gauge"><span class="end">${escape(left)}</span><div class="track"><div class="zero" style="left:${at(tick)}%"></div>`
    + `<div class="mark${verdict}" style="left:${at(llr)}%"></div></div><span class="end">${escape(right)}</span></div>`;
}

// Seconds as `5d 13h 7m`, `1h 5m`, `4m` or `35s`, never padded with zeros: whole minutes from 90 s,
// so never `1m`, the seconds below it; days once the hours reach 24.
function duration(seconds) {
  if (seconds < 90) return `${seconds}s`;
  const minutes = Math.round(seconds / 60);
  const d = Math.floor(minutes / 1440), h = Math.floor(minutes / 60) % 24, m = minutes % 60;
  if (d > 0) return `${d}d ${h}h ${m}m`;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// A trial's title: its kind and settings, then its two sides by role, the champion first as on the
// form and the gauge, each a player whose name says what it plays (`@untuned`, `@search-tuned`,
// `@search-time-tuned`).
function trialTitle(view) {
  const settings = view.trial === "match" ? ` of ${view.settings} pairs` : view.trial === "sprt" ? ` [${view.settings.replace(",", ", ")}]` : "";
  return `${view.trial}${settings}: champion ${view.champion} against challenger ${view.challenger}`;
}

// Sets `element`'s html, keeping the horizontal scroll of it and of each section in it, by position: a
// narrow screen scrolls a wide table sideways, and a poll's redraw would bring it back to the left.
function redraw(element, html) {
  if (element.innerHTML === html) return;
  const scrolled = [element, ...element.querySelectorAll("section")].map((e) => e.scrollLeft);
  element.innerHTML = html;
  [element, ...element.querySelectorAll("section")].forEach((e, i) => { if (scrolled[i]) e.scrollLeft = scrolled[i]; });
}

// `muted[i]` greys row i: a finished lambda.
function table(headers, rows, muted = []) {
  const head = headers.map((h) => `<th>${escape(h)}</th>`).join("");
  // A cell is text, or `{ html }` already escaped.
  const body = rows.map((row, i) => `<tr${muted[i] ? ' class="muted"' : ""}>${row.map((cell) => `<td>${typeof cell === "string" ? escape(cell) : cell.html}</td>`).join("")}</tr>`).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

// A games-a-second rate as the text bars write it: games a second from one a second, seconds a game
// below, so a slow trial under a clock reads as a number rather than `0.0 games/s`.
// `unit` the thing its line counts, `game` or `pair`, so a line never counts one and paces the other.
function rate(perSecond, unit = "game") {
  return perSecond >= 1 ? `${number(perSecond, 1)} ${unit}s/s` : `${number(1 / perSecond, 1)} s/${unit}`;
}

// A phase's time as its record gives it, after its count: `, 11m elapsed, 7.3 games/s, ETA about
// 54m`; each part only once its record gives it.
// `pairs` for a line counting pairs, as a tune's: its pace in pairs, two games each.
// `eta`, a continuous bar's own (`etaAt`), in place of the record's.
function times(view, pairs = false, eta = null) {
  const t = view.time;
  return (t.elapsed_seconds === null ? "" : `, elapsed ${duration(t.elapsed_seconds)}`)
    + (t.games_per_second === null ? "" : `, ${pairs ? rate(t.games_per_second / 2, "pair") : rate(t.games_per_second)}`)
    + (eta !== null ? eta : t.eta_seconds === null ? "" : `, ETA about ${duration(t.eta_seconds)}`);
}

// A bar of games (or a tune's pairs) under a `times` record: `count` done of `total`, the part under
// way by time at its games a second, capped at the pairs in play (`perTask` units each) and below
// `total`. Its position, and the ETA from it. Nothing under way unless a job runs and `live`: a past
// trial, shown while another job plays, is not the one in play.
function gamesUnderWay(key, view, count, total, perTask, pairs = false, live = true) {
  const t = view.time;
  if (!state.running || !live) return { position: count, eta: null };
  const perSecond = t && t.games_per_second ? (pairs ? t.games_per_second / 2 : t.games_per_second) : null;
  const position = count + underWay(key, count, perSecond, Math.min(perTask * inPlay(), Math.max(0, total - count)));
  return { position, eta: perSecond ? etaAt(position, total, perSecond) : null };
}

// `stop`, a trial's Stop beside its title, while it runs on its own screen.
function work(view, waiting, stop = "") {
  switch (view.kind) {
    case "self_play": {
      // Each set as the round robin's games. Its pace in positions, which its targets count, rather
      // than games, whose length varies. Elapsed, pace and ETA on the set being played alone, the test
      // set's first: its ETA that set's own, the training set's waiting until it is played.
      const t = view.time;
      const pace = t && t.positions_per_second !== null ? t.positions_per_second : null;
      const time = (left) => !t ? ""
        : (t.time.elapsed_seconds === null ? "" : `, elapsed ${duration(t.time.elapsed_seconds)}`)
          + (pace === null ? "" : `, ${whole(Math.round(pace))} positions/s`)
          + (pace === null || left <= 0 ? "" : `, ETA about ${duration(Math.round(left / pace))}`);
      // The set being played moves continuously: its positions under way by time at its pace, capped
      // at the games in play times this play's average positions a game.
      const set = (name, got, wanted, timed) => {
        const cap = Math.min(inPlay() * (view.positions_per_game || 0), Math.max(0, wanted - got));
        const position = timed && t ? got + underWay(`self-play ${name}`, got, pace, cap) : got;
        return `<div>${name}: ${whole(got)} of ${whole(wanted)} positions (${percent(wanted > 0 ? position / wanted : 0)})`
          + `${timed ? time(wanted - position) : ""}</div>${bar(position, wanted)}`;
      };
      const testing = view.test_got < view.test_wanted;
      return `<h2>Self-play with ${escape(view.teacher)}</h2>`
        + set("Test set", view.test_got, view.test_wanted, testing)
        + set("Training set", view.train_got, view.train_wanted, !testing);
    }
    case "round_robin": {
      // Games, not pairings complete: a tournament chore plays every pairing at once, the one furthest
      // behind first, so pairings complete only near the end. Each game counts in both its players'.
      const played = view.standings.reduce((sum, s) => sum + s.games, 0) / 2, total = view.pairings * view.wanted * 2;
      const going = gamesUnderWay("round robin", view, played, total, 2);
      return `<h2>Round robin: ${whole(view.wanted * 2)} games a pairing</h2><div class="muted">${escape(view.limit)}</div>`
        + `<div>${whole(played)} of ${whole(total)} games (${percent(total > 0 ? going.position / total : 0)})${times(view, false, going.eta)}</div>`
        + bar(going.position, total)
        + table(["rank", "candidate", "points", "games", "score"],
          // The score and its margin each in a slot of its own width, so both align whatever their digits.
          // A candidate by its label, its checkpoint's epoch: `epoch 2.25`.
          view.standings.map((s, i) => [String(i + 1), s.label, number(s.points, 1), whole(s.games),
            { html: `<span class="share">${escape(percent(s.score))}</span> <span class="margin">±${escape(percent(s.margin))}</span>` }]))
          .replace("<table>", `<table class="standings">`);
    }
    case "gate":
      // Its search, then its time, the leading comma of `times` dropped: no count before it.
      return `<h2>Gate</h2><div class="muted">${escape(view.limit)}${times(view).replace(/^, /, "; ")}</div>`
        + gauge(view.llr, view.lower, view.upper)
        // Both sides' points and shares, as a trial's.
        + table(["champion", "challenger", "games", "LLR", "bounds"],
          [[`${number(view.champion_points, 1)} (${percent(1 - view.challenger_share)})`,
            `${number(view.challenger_points, 1)} (${percent(view.challenger_share)})`, whole(view.games),
            number(view.llr, 2), `${number(view.lower, 2)} to ${number(view.upper, 2)}`]]);
    case "trial": {
      // A match knows its length and a duel projects it: a bar of its games with its ETA. A duel's and
      // an SPRT's gauge too, which end whenever the evidence is enough: a duel's starting at an even
      // score, an SPRT's at zero; a match's would only repeat its bar.
      // Under way only while it runs, its verdict not yet given.
      const going = view.expected_games === null ? null
        : gamesUnderWay(`trial ${view.champion} ${view.challenger}`, view, view.games, view.expected_games, 2, false, !view.verdict);
      const length = view.expected_games === null ? ""
        : `<div>${whole(view.games)} of ${view.trial === "duel" ? "about " : ""}${whole(view.expected_games)} games`
          + ` (${percent(view.expected_games > 0 ? going.position / view.expected_games : 0)})${times(view, false, going.eta)}</div>`
          + bar(going.position, view.expected_games);
      const evidence = view.trial === "match" ? ""
        : gauge(view.gauge.value, view.gauge.lower, view.gauge.upper, view.gauge.left, view.gauge.right, view.trial === "duel" ? 0.5 : 0,
          view.verdict === "won by the challenger" ? "challenger" : view.verdict === "won by the champion" ? "champion" : null);
      const progress = length + evidence;
      // A side's points and their share of the games: `452.0 (48.5%)`.
      const side = (points) => `${number(points, 1)} (${percent(view.games > 0 ? points / view.games : 0.5)})`;
      const mixed = view.mixed ? `<div class="bad">mixed: the two sides tuned differently</div>` : "";
      const title = `<h2>${escape(trialTitle(view))}</h2>`;
      return (stop ? `<div class="row">${title}${stop}</div>` : title) + `<div class="muted">${escape(view.limit)}</div>${mixed}`
        + progress
        // Both sides' points and shares, so neither reads as the score: one alone was ambiguous.
        // Wins, losses and draws from the champion's side, as the server counts them and the arena's
        // command line says them (`trials::Wdl`): + the champion's wins, - the challenger's. Headed
        // "results" (the developer, 2026-11-16), a word neutral between the sides. Blank for a trial
        // with pairs recorded before they were counted. Second, beside the games they split (the
        // developer, 2026-11-19).
        + table(["games", "results", "champion", "challenger", view.trial === "duel" ? "thresholds" : "state"],
          [[whole(view.games), view.wdl ? `+${view.wdl.wins} -${view.wdl.losses} =${view.wdl.draws}` : "",
            side(view.games - view.challenger_points), side(view.challenger_points), view.status]])
          .replace("<table>", `<table class="trial">`)
        + (view.verdict ? `<div><b>${escape(view.verdict)}</b></div>` : "");
    }
    case "pairs":
      return `<h2>Pairs: ${whole(view.played)} played, ${view.pairings} pairings of ${view.wanted}</h2>`;
    case "tune":
      // As a trial's: the count and its time above the bar, the time only while it deals; in games,
      // two a pair (the developer, 2026-11-13).
      // Continuous in pairs, a task each.
      const going = view.time ? gamesUnderWay("tune", view, view.done, view.pairs, 1, true) : { position: view.done, eta: null };
      return `<h2>Tune of ${escape(view.player)}</h2>`
        + `<div>${whole(2 * view.done)} of ${whole(2 * view.pairs)} games (${percent(view.pairs > 0 ? going.position / view.pairs : 0)})`
        + `${view.time ? times(view, false, going.eta) : ""}</div>${bar(going.position, view.pairs)}`
        + (view.reference_nps ? `<div class="muted">Bench: ${whole(Math.round(view.reference_nps))} nodes/s per thread on this machine, every arena's clock scaled to it</div>` : "")
        + table(["parameter", "what it does", "start", "now", "moved"], (() => {
          // One count of decimals for the whole table, the most any start has and one more, both
          // columns alike, so every decimal point lines up: a search tune's 150 as 150.0, a time
          // tune's 0.0594 as 0.05940 and its 3 as 3.00000.
          const decimals = 1 + Math.max(0, ...view.theta.map((p) => (String(p.start).split(".")[1] || "").length));
          // Moved: (now - start) / |start|, in percent, so its sign is the direction the value went
          // even for a negative start (-140 to -150 is -7.1%); blank for a start of 0.
          const moved = (p) => {
            if (p.start === 0) return "";
            const change = 100 * (p.now - p.start) / Math.abs(p.start);
            return `${change >= 0 ? "+" : "−"}${number(Math.abs(change), 1)}%`;
          };
          return view.theta.map((p) => [p.name, p.description, number(p.start, decimals), number(p.now, decimals), moved(p)]);
        })()).replace("<table>", `<table class="tune">`);
    default:
      return `<h2>Nothing dealt</h2><div class="muted">${escape(waiting)}</div>`;
  }
}

// The training's progress: its budget's, whose length is known from the start. A fresh attempt, no
// round recorded: its first round's pass alone.
function trainingProgress(last, round) {
  if (!last) return roundLine(round);
  return budgetProgress(last, round);
}

// A budgeted attempt's progress: its rounds of the budget's, its ETA the rounds left at the average pace of
// the rounds done, not the latest round's (the developer, 2026-11-19): a budget's rounds are alike.
// No line for the round under way (the developer, 2026-11-18): the budget's own line says it.
// The bar also moves within the round under way, as its live pass says, so it advances at every poll
// (every two seconds) rather than once a round: the training half by its share done, the test half
// as the training done.
function budgetProgress(r, round = null) {
  const total = r.schedule.total_rounds;
  const elapsed = `elapsed ${duration(Math.round(r.elapsed_seconds))}`;
  // Round 0 only tests: no ETA until a round has trained.
  const left = Math.max(0, total - r.round);
  const pace = r.round > 0 ? r.elapsed_seconds / r.round : 0;
  const partial = r.finished || !round || left === 0 ? 0
    : round.half === "test" ? 1 : Math.min(1, round.done / Math.max(1, round.total));
  const position = r.round + partial;
  // The rounds left counted from the round under way's progress, not its start, so the ETA falls at
  // every poll and stays within the minute: the rounds are alike to about a second.
  const eta = !r.finished && r.round > 0 && left > 0 ? `, ETA about ${duration(Math.round((total - position) * pace))}` : "";
  // The speed, as every other bar gives it after its percent: in seconds a round, training and test,
  // at the average pace the ETA uses (a round takes about a minute, so rounds/s would read 0.0).
  const rate = r.round > 0 ? `, ${number(pace, 1)} s/round` : "";
  return `<div>round ${whole(r.round)} of ${whole(total)} (${percent(position / Math.max(1, total))})${rate}, `
    + `${elapsed}${eta}</div>${bar(position, total, position)}`;
}

// The round under way, as the text bar has it: its half, done of total, rate, and that half's ETA.
function roundLine(round) {
  if (!round) return "";
  const half = round.half === "test" ? "testing" : "training";
  const rate = round.rate === null ? "" : `, ${number(round.rate, 1)} ${round.unit}/s`;
  const eta = round.eta_seconds === null ? "" : `, ETA about ${duration(Math.round(round.eta_seconds))}`;
  // Worded and styled as the budget's line above the bar.
  return `<div>${round.round ? `${escape(round.round)}, ` : ""}${half}: ${whole(round.done)} of ${whole(round.total)} ${round.unit} `
    + `(${percent(round.done / Math.max(1, round.total))})${rate}${eta}</div>`;
}

// The generation's one run at its latest round (`null` before the server lists it), and a polyline
// attempt's ten values once measured: lambda by a position's progress through its game, one value
// per tenth of the game, fixed for the whole run; never a schedule over the training's rounds.
function training(run, round = null, polyline = null) {
  const values = polyline ? `<div class="muted">lambda for each tenth of a game: ${escape(polyline)}</div>` : "";
  const r = run ? run.last : null;
  // The budget, under the polyline: its rate's two ends and how it falls between them.
  const plan = r ? r.schedule : null;
  const rates = plan
    ? `<div class="muted">learning rate falling geometrically from ${escape(plan.start.toExponential(0))} `
      + `to ${escape(plan.end.toExponential(0))} over ${escape(String(plan.epochs))} epochs</div>`
    : "";
  const head = `<h2>Training</h2>${values}${rates}${trainingProgress(r, round)}`;
  if (!run) return head;
  const columns = ["learning rate", "train loss", "test loss", "best loss", "best round"];
  if (!r) return head + table(columns, [["not started", "", "", "", ""]], [false]);
  // Green when the best is this very round's.
  const best = `<span class="loss${!r.finished && r.best_round === r.round ? " fresh" : ""}">${escape(number(r.best_loss, 6))}</span>`;
  // The best's round alone: the latest is the progress line's, and `590 / 592` read as progress
  // (the developer, 2026-11-27).
  // The falling rate in three digits.
  const row = [r.learning_rate.toExponential(2), number(r.train_loss, 6), number(r.test_loss, 6), { html: best }, whole(r.best_round)];
  return head + table(columns, [row], [r.finished]).replace("<table>", `<table class="training">`) + lossChart(run.curve || [], r);
}

// The run's losses round by round, `curve` its `[round, train, test, rate]` rows: train and
// test lines and a dot at the best round. Round 0 left out: it only tests, and its loss, far above the
// rest, would flatten the curve. Inline SVG drawn at the box's own width in pixels, never scaled
// (the developer, 2026-11-27): a phone's chart keeps its labels at their size and grows taller in
// proportion, a wide screen's stays short. A resize redraws it.
// A budget knows its length, so its axis is fixed from the start at its rounds (the developer,
// 2026-11-18): a feature stays where it is round after round, and the empty width is what is left.
// No mark at the round robin candidates' rounds (the developer, 2026-11-27): the round grid alone.
function lossChart(curve, last) {
  const rows = curve.filter((c) => c[0] >= 1 && Number.isFinite(c[1]) && Number.isFinite(c[2]));
  if (rows.length === 0) return "";
  // The section's inner width: the page's main column less the section's padding and border.
  const main = document.querySelector("main");
  const width = Math.max(240, Math.floor((main ? main.clientWidth : 1000) - 30));
  // Four fifths of the width on a phone, at least 240 pixels, never past 300 on a wide screen.
  const height = Math.min(300, Math.max(240, Math.round(width * 0.8)));
  let left = 56;
  const [right, top, bottom] = [6, 28, 28];
  const plan = last ? last.schedule : null;
  const first = plan ? 1 : rows[0][0];
  const latest = plan ? Math.max(plan.total_rounds, rows[rows.length - 1][0]) : rows[rows.length - 1][0];
  // The y range from the rounds after the first tenth alone, linear: the first rounds' steep drop
  // would otherwise take the whole height. Their lines leave the plot through its top, cut there by
  // a clip rectangle, not pinned to the edge, which would draw values that never were.
  const losses = rows.slice(Math.floor(rows.length / 10)).flatMap((c) => [c[1], c[2]]);
  const dataLow = Math.min(...losses), dataHigh = Math.max(...losses);
  // Always five loss ticks (the developer, 2026-11-27), the axis running from the first to the
  // last: the step is 1, 2 or 5 times a power of ten, the smallest whose four steps from a multiple
  // of it at or below the lowest loss reach the highest. Labels in three decimals, more when the step
  // needs them, so no two read alike.
  const steps = 4;
  let tickStep = 1e-6, base = 0;
  search: for (let power = 1e-6; ; power *= 10) {
    for (const m of [1, 2, 5]) {
      const s = m * power;
      const b = Math.floor(dataLow / s);
      if ((b + steps) * s >= dataHigh) { tickStep = s; base = b; break search; }
    }
  }
  const low = base * tickStep, high = (base + steps) * tickStep;
  const decimals = Math.max(3, Math.ceil(-Math.log10(tickStep) - 1e-9));
  // The left margin just wide enough for the loss labels: about 6.5 pixels a character at 11
  // pixels, then the 6-pixel gap to the axis (the developer, 2026-11-27).
  left = Math.ceil((decimals + 2) * 6.5) + 8;
  const x = (round) => left + (latest === first ? 0 : (round - first) / (latest - first)) * (width - left - right);
  const y = (loss) => top + (high - loss) / (high - low) * (height - top - bottom);
  const path = (index) => rows.map((c, i) => `${i ? "L" : "M"}${x(c[0]).toFixed(1)},${y(c[index]).toFixed(1)}`).join("");
  const lossTicks = Array.from({ length: steps + 1 }, (_, i) => i).map((i) => (base + i) * tickStep);
  const ticks = lossTicks.map((loss) =>
    `<text x="${left - 6}" y="${(y(loss) + 4).toFixed(1)}" text-anchor="end">${loss.toFixed(decimals)}</text>`).join("");
  // Round ticks at 1, 2 or 5 times a power of ten (the developer, 2026-11-27), the smallest step
  // giving at most eight of them, as the loss ticks are chosen; fewer on a narrow chart, one per
  // 60 pixels, so their labels never touch.
  const most = Math.max(2, Math.min(8, Math.floor((width - left - right) / 60)));
  let step = 1;
  search: for (let power = 1; ; power *= 10) {
    for (const m of [1, 2, 5]) {
      if ((latest - first) / (m * power) <= most) { step = m * power; break search; }
    }
  }
  const rounds = [];
  for (let round = Math.ceil(first / step) * step; round <= latest; round += step) rounds.push(round);
  // A label at the axis's very end ends there, the right margin being too thin to centre it.
  const roundTicks = rounds.map((round) => `<text x="${x(round).toFixed(1)}" y="${height - 8}" text-anchor="${x(round) > width - right - 16 ? "end" : "middle"}">${whole(round)}</text>`).join("");
  // A gray line across the plot at each loss tick and at each round tick.
  const grid = lossTicks.map((loss) =>
    `<line class="stage" x1="${left}" x2="${width - right}" y1="${y(loss).toFixed(1)}" y2="${y(loss).toFixed(1)}"/>`).join("")
    + rounds.map((round) =>
      `<line class="stage" x1="${x(round).toFixed(1)}" x2="${x(round).toFixed(1)}" y1="${top}" y2="${height - bottom}"/>`).join("")
    // The plot inside a rectangle (the developer, 2026-11-27): top and right in the axes' color,
    // unlabelled, an edge darker than the grid, so a round tick just short of the end reads as a
    // grid line beside it.
    + `<rect class="axis" fill="none" x="${left}" y="${top}" width="${width - left - right}" height="${height - top - bottom}"/>`;
  const bestRow = last && rows.find((c) => c[0] === last.best_round);
  const best = bestRow ? `<circle class="best" cx="${x(bestRow[0]).toFixed(1)}" cy="${y(bestRow[2]).toFixed(1)}" r="5"/>` : "";
  // Above the plot, right aligned, train then test on one line (the developer, 2026-11-27).
  const end = width - right;
  const legend = `<line class="train" x1="${end - 158}" x2="${end - 138}" y1="10" y2="10"/>`
    + `<text x="${end - 132}" y="14">train loss</text>`
    + `<line class="test" x1="${end - 70}" x2="${end - 50}" y1="10" y2="10"/>`
    + `<text x="${end}" y="14" text-anchor="end">test loss</text>`;
  return `<svg class="chart" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="training and test loss by round">`
    + `<defs><clipPath id="loss-plot"><rect x="${left}" y="${top}" width="${width - left - right}" height="${height - top - bottom}"/></clipPath></defs>`
    + grid
    + `<line class="axis" x1="${left}" x2="${left}" y1="${top}" y2="${height - bottom}"/>`
    + `<line class="axis" x1="${left}" x2="${width - right}" y1="${height - bottom}" y2="${height - bottom}"/>`
    + ticks + roundTicks
    + `<g clip-path="url(#loss-plot)"><path class="train" d="${path(1)}"/><path class="test" d="${path(2)}"/></g>`
    + best + legend + `</svg>`;
}

// A phase as the page words it, as its section's heading does; the state file's name ("train",
// "round-robin") stays as it is, since earlier attempts are read back by it.
function phaseName(phase) {
  return { play: "playing", train: "training", "round-robin": "round robin", stopped: "stopped by its gate" }[phase] || phase;
}

// A forge's generation, every phase it has reached, latest first, each in its own section; while `live`,
// the first of them is the one under way, bordered in blue.
function forge(view, live = false) {
  const phases = [view.gate && work(view.gate), view.round_robin && work(view.round_robin), (view.training || view.round) && training(view.training, view.round, view.polyline),
    view.play && work(view.play)].filter(Boolean);
  return phases.map((html, i) => `<section${live && i === 0 ? ' class="current"' : ""}>${html}</section>`).join("");
}

// The machines the smithy claims arenas on, then the arenas joined to the job, each in its own box.
function arenas(list, machines) {
  // An arena holds finished tasks only while it cannot reach this smithy, so the count is said only then.
  const claimed = `<section><h2>Machines</h2>` + table(["machine", "state"],
    machines.map((m) => [m.machine || m.target, m.outbox ? `${m.state}; holding ${whole(m.outbox)} finished to send` : m.state])) + `</section>`;
  if (list.length === 0) {
    const none = state.no_arena ? "no arena: this job waits for one, each held by another smithy or not answering (Machines above)" : "no arena";
    return claimed + `<section><h2>Arenas</h2><div class="muted">${none}</div></section>`;
  }
  return claimed + `<section><h2>Arenas</h2>` + table(["session", "workers", "chore", "in play", "done", "rate", "seen", "commit"],
    list.map((c) => [c.session, String(c.workers), c.chore || "none", c.in_play === null ? "" : whole(c.in_play), whole(c.done),
      c.per_hour === null ? "" : `${whole(Math.round(c.per_hour))}/h`, `${c.seen_seconds_ago} s ago`, c.commit.slice(0, 12)])) + `</section>`;
}

// The control token of the latest poll, on the page opened on the smithy's own machine alone: the
// buttons that start or stop a job show only then. A restarted smithy has a new one.
let token = null;
// Whether a job is running, from the latest poll: every start button waits for its end.
let running = false;
// `catalog.json`, and the text the config's page was last drawn from: drawn again only when it
// changes, so a button being pressed is never replaced under the pointer.
let catalog = null;
let catalogDrawn = "";
// The latest poll's state.
let state = null;
// The attempt being viewed and its generation; null when none is.
let viewing = null;
// The config whose page is open, from the address's `#<config>`; null on the main page.
let current = null;
// The attempt whose screen is open, from the address's `#<config>/<attempt>`, or a tune's job
// (`tuneScreen`); null on the config's own screen.
let currentAttempt = null;
// New attempt pressed: its config and how many attempts it had, so the page opens the new attempt's
// screen once the catalog lists it; the job is named `<config>, a new attempt` until then.
let pendingNew = null;
// Start pressed on New trial: the trial's screen opens once it plays and its number is known.
let pendingTrial = false;
// The boxes' sections, one a source, in this order, each its source's box first, then the forges
// trained on it; a forge of no source known here, last, under Other.
const SECTIONS = [["pesto", "PeSTO"], ["lc0", "Lc0"]];
// The sources, each with its own box beside the forges: lc0's Convert runs in the source slot,
// beside the arena job; pesto's Play in the arena slot.
const SOURCES = ["lc0", "pesto"];
// The trials' screen, and the config a trial's job is of (the smithy's `TRIALS_SCREEN`).
const TRIALS = "trials";
// The books' screen, and the config a book job is of (the smithy's `BOOKS_SCREEN`).
const BOOKS = "books";
// The New trial form's choices, kept across its redraws.
const trialForm = {
  kind: "duel", pairs: "500", elo0: "0", elo1: "5", challenger: "", champion: "pesto",
  challengerParameters: "untuned", championParameters: "untuned",  limit: "depth", depth: "9",
  // The clock, in labelled fields: no notation to remember (`clockText` writes it). Each kind keeps
  // its own values, so switching back and forth loses nothing.
  clockKind: "fischer", base: "10", increment: "0.1", moves: "40", periodBase: "900", periodIncrement: "0",
};

// The clocks the project plays most, one click each: the tune's and the gate duel's, the verdicts',
// CCRL's 40/15. The fields stay editable.
const CLOCK_PRESETS = [
  { label: "10+0.1", clockKind: "fischer", base: "10", increment: "0.1" },
  { label: "180+2", clockKind: "fischer", base: "180", increment: "2" },
  { label: "40/15", clockKind: "repeating", moves: "40", periodBase: "900", periodIncrement: "0" },
];

// The clock's notation from the form's fields (arena's `TimeControl`: `<base>+<inc>`,
// `<moves>/<base>` or `<moves>/<base>+<inc>`, in seconds), or why the fields are not a clock.
function clockText() {
  const f = trialForm;
  const seconds = (text, name, positive) => {
    const value = Number(text.trim());
    if (text.trim() === "" || !Number.isFinite(value) || (positive ? value <= 0 : value < 0)) {
      return { error: `${name}: ${positive ? "more than 0" : "0 or more"} seconds` };
    }
    return { value: String(value) };
  };
  if (f.clockKind === "fischer") {
    const base = seconds(f.base, "base", true);
    const increment = seconds(f.increment, "increment", false);
    if (base.error || increment.error) return { error: base.error || increment.error };
    return { text: `${base.value}+${increment.value}` };
  }
  const moves = Number(f.moves.trim());
  if (f.moves.trim() === "" || !Number.isInteger(moves) || moves < 1) return { error: "moves: a whole number, 1 or more" };
  const base = seconds(f.periodBase, "time", true);
  const increment = seconds(f.periodIncrement, "increment", false);
  if (base.error || increment.error) return { error: base.error || increment.error };
  return { text: increment.value === "0" ? `${moves}/${base.value}` : `${moves}/${base.value}+${increment.value}` };
}

const option = (value, label, selected) => `<option value="${escape(value)}"${selected ? " selected" : ""}>${escape(label)}</option>`;

async function send(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "X-Fattorini-Token": token }, body });
  return response.ok ? "" : (await response.text()).trim() || `refused (${response.status})`;
}

// Starts the job of `words`, its refusal said beside the button pressed; once started, opens the
// screen the button names (`data-screen`), if any.
async function start(words, button) {
  const error = await send("control/job", words.join("\n"));
  const said = button.parentElement.querySelector(".said");
  if (said) said.textContent = error;
  if (error) return;
  catalogDrawn = "";
  if (button.dataset.screen) location.hash = screenHash(current, button.dataset.screen);
}

// The address of a config's screen, or of one of its attempts' screens.
function screenHash(config, attempt) {
  return "#" + encodeURIComponent(config) + (attempt ? "/" + encodeURIComponent(attempt) : "");
}

// A tune's screen: its job's name, as the smithy names it.
const tuneScreen = (player) => `tune of ${player}`;

// The screen of the smithy's job: its attempt's name, a tune's job name; null for a source's job
// (Play, Convert), shown on its source's own screen, and for a new attempt not yet in the catalog.
function jobScreen() {
  if (!state || !state.job || !catalog) return null;
  if (state.job.startsWith("tune of ")) return state.job;
  // A trial's, by its number, while it plays: `#trials/<number>`.
  if (state.config === TRIALS) return state.work && state.work.kind === "trial" ? String(state.work.number) : null;
  const config = catalog.configs.find((c) => c.name === state.config);
  if (!config) return null;
  if (state.job === `${config.name}, a new attempt`) {
    const last = config.attempts[config.attempts.length - 1];
    const listed = last && !(pendingNew && pendingNew.config === config.name && config.attempts.length <= pendingNew.attempts);
    return listed ? last.name : null;
  }
  return state.job;
}

// Whether the open screen is the job's own.
function jobHere() {
  return currentAttempt !== null && state.config === current && jobScreen() === currentAttempt;
}

function tuneText(tune) {
  if (!tune) return "not tuned";
  return tune[0] >= tune[1] ? `tuned, ${whole(2 * tune[1])} games` : `tune at ${whole(2 * tune[0])} of ${whole(2 * tune[1])} games`;
}

const tuneDone = (tune) => tune && tune[0] >= tune[1];
const timeTuneScreen = (player) => `tune of ${player}, time`;

// A player's tunes: its search's, then, once that is done, its time management's (the developer,
// 2026-11-13: the search first, then the time); where each stands and, on this machine, a button
// for one not finished, as its config's tune: says.
function tuneRow(player) {
  const button = (word, screen, tune, label) => token && !tuneDone(tune)
    ? ` <button data-tune="${escape(player.name)}" data-tune-word="${word}" data-screen="${escape(screen)}"${running ? " disabled" : ""}>${tune ? `Resume ${label}` : label[0].toUpperCase() + label.slice(1)}</button><span class="said bad"></span>`
    : "";
  const search = `<div class="row"><span>${escape(player.name)}, search: ${escape(tuneText(player.tune))}</span>`
    + button("--tune", tuneScreen(player.name), player.tune, "tune") + `</div>`;
  const time = !tuneDone(player.tune) ? ""
    : `<div class="row"><span>${escape(player.name)}, time: ${escape(tuneText(player.time_tune))}</span>`
      + button("--time-tune", timeTuneScreen(player.name), player.time_tune, "time tune") + `</div>`;
  return search + time;
}

function attemptWhere(attempt) {
  const scaled = attempt.scale ? `scaled 1/${attempt.scale}, ` : "";
  if (attempt.generation === null) return `${scaled}not started`;
  const where = `generation ${attempt.generation}, ${phaseName(attempt.phase)}`;
  return scaled + (attempt.finished ? `ended at ${where}` : where);
}

// ", scaled 1/<s>" after a scaled attempt's name `name`, as the catalog has its scale; nothing for
// any other name, a full attempt's, a trial's or a tune's.
function scaledMark(name) {
  if (!catalog) return "";
  for (const config of catalog.configs) {
    const attempt = config.attempts.find((r) => r.name === name);
    if (attempt) return attempt.scale ? `, scaled 1/${attempt.scale}` : "";
  }
  return "";
}

// A full attempt needs a CUDA GPU: on a machine without one, its buttons are disabled, saying why; a
// scaled attempt trains on the CPU. The smithy's `NO_GPU`, which refuses the job too.
const NO_GPU = "no CUDA GPU on this machine: training is not available here";

function noGpu() {
  return state && state.gpu === false;
}

// A forge's button's attributes past its data: disabled while a job runs, or without a GPU when it
// would train a full attempt (`full`): a new one, or one resumed at its training.
function forgeDisabled(full) {
  const blocked = full && noGpu();
  return (running || blocked ? " disabled" : "") + (blocked ? ` title="${NO_GPU}"` : "");
}

// An attempt's Resume, on this machine, for an attempt not finished; it opens the attempt's screen.
// The smithy asks the other smithies first (`lease.rs`), and a refusal comes back as any job's.
function resumeButton(config, attempt) {
  if (attempt.finished || !token) return "";
  const data = `data-forge="${escape(config.name)}" data-attempt="${attempt.number}" data-screen="${escape(attempt.name)}"`;
  return ` <button ${data}${forgeDisabled(!attempt.scale && attempt.phase === "train")}>Resume</button>`;
}

// One attempt: where it stands, View or Open, Resume; the tune of each generation that passed its
// gate, started by hand, whether the attempt has ended or waits (the developer, 2026-11-02).
function attemptBlock(config, attempt) {
  const resume = resumeButton(config, attempt);
  // The running job's own attempt opens its job's screen; every other attempt is viewed, a job running or not.
  const mine = running && state.config === config.name && jobScreen() === attempt.name;
  const view = mine ? ` <span class="tag">running</span> <button class="plain" data-screen-open="${escape(attempt.name)}">Open</button>`
    : attempt.generations.length > 0 ? ` <button class="plain" data-screen-open="${escape(attempt.name)}">View</button>` : "";
  const tunes = attempt.generations.filter((g) => g.passed).map((g) => tuneRow(g.player)).join("");
  return `<div class="attempt"><div class="row"><b>${escape(attempt.name)}</b><span class="muted">${escape(attemptWhere(attempt))}</span>${view}${resume}<span class="said bad"></span></div>`
    + (tunes ? `<div class="tunes">${tunes}</div>` : "")
    + `</div>`;
}

// The boxes, by section: `[title, names]`, each source's box first, then its forges by name, which
// orders them from the simplest features to the richest (psq, psq-threats, psq-threats-pairwise, psq-threats-screlu,
// psq-threats-screlu-material, psq-threats-screlu-phase).
function boxSections() {
  const known = SECTIONS.map(([source]) => source);
  const forges = (source) => catalog.configs.filter((config) => config.source === source).map((config) => config.name).sort();
  const sections = SECTIONS.map(([source, title]) => [title, [source, ...forges(source)]]);
  const other = catalog.configs.filter((config) => !known.includes(config.source)).map((config) => config.name).sort();
  return [...sections, ...(other.length > 0 ? [["Other", other]] : []), ["Books", [BOOKS]], ["Trials", [TRIALS]]];
}

// Whether Lc0's Convert holds the source slot, beside the arena job.
function converting() {
  return Boolean(state && state.slot.kind === "convert");
}

// Whether a book job holds the source slot, beside the arena job.
function makingBook() {
  return Boolean(state && state.slot.kind === "book");
}

// Whether a job of config `name` runs: the arena job, or lc0's conversion or a book job beside it.
function isRunning(name) {
  if (!state) return false;
  return (state.running && state.config === name) || (name === "lc0" && converting()) || (name === BOOKS && makingBook());
}

function source(name) {
  return catalog.sources.find((s) => s.name === name);
}

// A box's one line: the running job when it is this config's, else its count of attempts, or a source's corpus.
function boxLine(name) {
  if (name === "lc0" && converting()) {
    return `<span class="tag">running</span> Lc0's conversion`;
  }
  if (name === BOOKS) {
    if (makingBook()) return `<span class="tag">running</span> ${escape(state.slot.holder || "")}`;
    const count = catalog.books.length;
    return count === 0 ? `<span class="muted">no source yet</span>` : count === 1 ? "1 source" : `${count} sources`;
  }
  if (isRunning(name)) {
    const where = state.phase ? `: generation ${state.generation}, ${phaseName(state.phase)}` : "";
    return `<span class="tag">running</span> ${escape(state.job || "")}${escape(where)}`;
  }
  if (name === TRIALS) {
    const last = catalog.trials[catalog.trials.length - 1];
    return last ? `last: ${escape(last.kind)}, ${escape(last.verdict)}` : `<span class="muted">no trial yet</span>`;
  }
  if (SOURCES.includes(name)) {
    const line = escape(source(name).summary);
    return name === "pesto" ? `${line}; ${escape(tuneText(catalog.pesto.tune))}` : line;
  }
  const config = catalog.configs.find((c) => c.name === name);
  // Only the count: no attempt is singled out, the latest being not always the one that matters.
  const attempts = config ? config.attempts.length : 0;
  if (attempts === 0) return `<span class="muted">no attempt yet</span>`;
  return attempts === 1 ? "1 attempt" : `${attempts} attempts`;
}

function drawBoxes() {
  const element = document.getElementById("boxes");
  const box = (name) => `<button class="box${isRunning(name) ? " running" : ""}" data-open="${escape(name)}"><b>${escape(name)}</b><span>${boxLine(name)}</span></button>`;
  element.innerHTML = boxSections().map(([title, names]) => `<h2>${escape(title)}</h2><div class="boxes">${names.map(box).join("")}</div>`).join("");
  element.querySelectorAll("[data-open]").forEach((box) => {
    box.onclick = () => { location.hash = encodeURIComponent(box.dataset.open); };
  });
}

// A source's corpus: its state, and its job's button on this machine: lc0's Convert, beside the
// arena job, disabled once its corpus is complete (a raised cap needs complete.txt deleted by hand
// first) or while a book job holds the source slot; pesto's Play, an arena job, until its corpus is
// complete.
function corpusSection(name) {
  const entry = source(name);
  let button = "";
  if (token && name === "lc0" && !converting()) {
    button = `<button data-source="--convert"${entry.complete || state.slot.running ? " disabled" : ""}>Convert</button>`;
  }
  if (token && name === "pesto" && !entry.complete) {
    button = `<button data-source="--play"${running ? " disabled" : ""}>Play</button>`;
  }
  // Lc0's Convert, under way, drawn into its own place at each poll (`drawConvertProgress`).
  const progress = name === "lc0" ? `<div id="convertProgress"></div>` : "";
  return `<section><h2>Corpus</h2><div class="row"><span>${escape(entry.summary)}</span>${button}<span class="said bad"></span></div>${progress}</section>`;
}

// The open config's page below its live sections: its attempts and New attempt, or a source's corpus, and
// pesto's tune.
function drawConfig() {
  const text = current + currentAttempt + JSON.stringify(catalog) + running + state.slot.running + state.slot.kind + state.job + jobScreen() + !!token
    + claimedMachines().join();
  if (text === catalogDrawn) return;
  catalogDrawn = text;
  const element = document.getElementById("config");
  if (current === TRIALS && currentAttempt !== null) {
    element.innerHTML = trialScreen();
    bindTrialForm(element);
  } else if (currentAttempt !== null) {
    element.innerHTML = attemptScreen();
  } else if (current === TRIALS) {
    element.innerHTML = trialsScreen();
    bindTrialForm(element);
  } else if (current === BOOKS) {
    element.innerHTML = booksScreen();
  } else if (current === "pesto") {
    element.innerHTML = corpusSection("pesto") + `<section><h2>Tune</h2>${tuneRow(catalog.pesto)}</section>`;
  } else if (current === "lc0") {
    element.innerHTML = corpusSection("lc0");
  } else {
    const config = catalog.configs.find((c) => c.name === current);
    if (!config) {
      element.innerHTML = `<section class="bad">no config ${escape(current)} in configs/</section>`;
      return;
    }
    const attempts = config.attempts.map((attempt) => attemptBlock(config, attempt)).join("") || `<div class="muted">no attempt yet</div>`;
    const fresh = token
      ? `<div class="row newattempt"><button data-forge="${escape(config.name)}" data-attempt="new"${forgeDisabled(true)}>New attempt</button>`
        + ` <button data-forge="${escape(config.name)}" data-attempt="new" data-scaled${forgeDisabled(false)}>New scaled attempt</button>`
        + `<span class="said bad"></span></div>`
      : "";
    const gpu = token && noGpu() ? `<div class="muted">no CUDA GPU on this machine: a full attempt's training is not available here, its other phases are; a scaled attempt trains on the CPU</div>` : "";
    element.innerHTML = `<section><h2>Attempts</h2>${gpu}${attempts}${fresh}</section>`;
  }
  element.querySelectorAll("[data-forge]").forEach((button) => {
    button.onclick = () => {
      if (button.dataset.attempt === "new") {
        const config = catalog.configs.find((c) => c.name === button.dataset.forge);
        pendingNew = { config: button.dataset.forge, attempts: config ? config.attempts.length : 0 };
      }
      const words = ["--forge", button.dataset.forge, button.dataset.attempt];
      // The smithy's fixed factor, `scale::DEFAULT`.
      if (button.dataset.scaled !== undefined) words.push("scaled");
      start(words, button);
    };
  });
  element.querySelectorAll("[data-screen-open]").forEach((button) => {
    button.onclick = () => { location.hash = screenHash(current, button.dataset.screenOpen); };
  });
  element.querySelectorAll("[data-tune]").forEach((button) => {
    button.onclick = () => start([button.dataset.tuneWord, button.dataset.tune], button);
  });
  element.querySelectorAll("[data-source]").forEach((button) => {
    button.onclick = () => start([button.dataset.source, current], button);
  });
  element.querySelectorAll("[data-book]").forEach((button) => {
    const row = button.parentElement;
    const weights = row.querySelector("select.weights");
    const softmax = row.querySelector(".softmax");
    if (softmax) weights.onchange = () => softmax.classList.toggle("hidden", weights.value !== "softmax");
    button.onclick = () => {
      const words = ["--book", button.dataset.book, "--weights", weights.value];
      if (weights.value === "softmax") {
        words.push("--temperature", row.querySelector(".temperature").value, "--scores", row.querySelector(".scoresFile").value);
      }
      start(words, button);
    };
  });
  element.querySelectorAll("[data-score]").forEach((button) => {
    const row = button.parentElement;
    button.onclick = () => start(["--score-book", button.dataset.score,
      `${row.querySelector(".scoreNetwork").value}@${row.querySelector(".scoreTuned").value}`, row.querySelector(".scoreDepth").value], button);
  });
}

// The machines whose arena this smithy holds, by name.
function claimedMachines() {
  return state.machines.filter((m) => m.machine).map((m) => m.machine);
}

// The books' screen: the job beside the arena job while a book job runs, then one section a source
// on the remote, its PGN and how far its stages have gone, with Make book on this machine. Make book
// runs the stages missing, in order; one already done is kept, redoing it is deleting its file.
function booksScreen() {
  const progress = `<section id="bookProgress" class="hidden"></section>`;
  if (catalog.books.length === 0) {
    return progress + `<section class="muted">no source yet: a source is a folder of data/books/ on the remote holding its PGN, `
      + `&lt;source&gt;.pgn or &lt;source&gt;.pgn.zst</section>`;
  }
  const sources = catalog.books.map((source) => {
    const fit = source.alpha === null ? `<span class="muted">not yet</span>` : `alpha ${number(source.alpha, 4)}`;
    const graph = source.graph === null ? `<span class="muted">not yet</span>` : `N = ${source.graph.n}, from ${whole(source.graph.games)} games`;
    // A softmax book shows its first-gate report's two numbers beside it.
    const books = source.books.length === 0 ? `<span class="muted">none yet</span>`
      : source.books.map((book) => escape(`n${book.n} ${book.weights}`)
        + (book.bad_in_reach === null ? "" : `<div class="muted">bad moves within reach ${escape(book.bad_in_reach)}; `
          + `the human book plays one ${escape(book.old_chance || "?")}</div>`)).join("<br>");
    const complete = (scores) => scores.moves !== null && scores.rows >= scores.moves;
    const scores = source.scores.length === 0 ? `<span class="muted">none yet</span>`
      : source.scores.map((scores) => escape(`${scores.name}: ${whole(scores.rows)} of ${scores.moves === null ? "?" : whole(scores.moves)} moves`)).join("<br>");
    const finished = source.scores.filter(complete);
    const softmax = finished.length === 0 ? "" : `<span class="softmax hidden"><select class="scoresFile">`
      + finished.map((scores, index) => option(scores.name, scores.name, index === 0)).join("")
      + `</select> T <input class="temperature" type="number" min="1" step="1" value="20" size="4"> cp</span>`;
    const make = source.pgn === null
      ? `<div class="muted">its PGN is no longer on the remote: its books stay, but none can be made</div>`
      : token
      ? `<div class="row"><select class="weights">${option("points", "points", true)}${option("counts", "counts", false)}`
        + (finished.length === 0 ? "" : option("softmax", "softmax", false)) + `</select>${softmax}`
        + `<button data-book="${escape(source.name)}"${state.slot.running ? " disabled" : ""}>Make book</button><span class="said bad"></span></div>`
      : "";
    // Scoring takes the arenas, so any arena job holds it back; a graph first.
    const networks = catalog.networks.filter((network) => network.name !== "pesto");
    const score = source.graph === null || !token || networks.length === 0 ? ""
      : `<div class="row"><select class="scoreNetwork">${networks.map((network, index) => option(network.name, network.name, index === networks.length - 1)).join("")}</select>`
        + `<select class="scoreTuned">${option("search-tuned", "search-tuned", true)}${option("untuned", "untuned", false)}</select>`
        + ` depth <input class="scoreDepth" type="number" min="1" max="30" step="1" value="20" size="3">`
        + `<button data-score="${escape(source.name)}"${state.running ? " disabled" : ""}>Score book</button><span class="said bad"></span></div>`;
    return `<section><h2>${escape(source.name)}</h2><div class="muted">${escape(source.pgn || "no PGN")}</div>`
      + table(["stage", "on the remote"], [["fit", { html: fit }], ["graph", { html: graph }], ["scores", { html: scores }], ["books", { html: books }]])
      + score + make + `</section>`;
  }).join("");
  return progress + `<section id="scoreProgress" class="hidden"></section>` + sources;
}

// A book's scoring, on the books' screen while it runs: its moves scored of the book's, its pace and
// time left, and any arena refused; Stop stops the arena job, not the source slot.
function drawScoreProgress() {
  const section = document.getElementById("scoreProgress");
  if (!section) return;
  const shown = state.running && state.work && state.work.kind === "score";
  section.classList.toggle("hidden", !shown);
  if (!shown) return;
  const work = state.work;
  const rate = work.moves_per_second === null ? "" : `, ${number(work.moves_per_second, 1)} moves/s`;
  const eta = work.eta_seconds === null ? "" : `, ETA about ${duration(work.eta_seconds)}`;
  const line = `${whole(work.done)} of ${whole(work.total)} moves (${percent(work.done / Math.max(1, work.total))})${rate}${eta}`;
  const rejected = work.refused.length === 0 ? "" : `<div class="bad">refused: ${work.refused.map(escape).join("; ")}</div>`;
  const stopping = state.job_stopping;
  const stop = token ? `<button id="stopScore"${stopping ? " disabled" : ""}>${stopping ? "Stopping" : "Stop"}</button>` : "";
  redraw(section, `<div class="row"><h2>Scoring: ${escape(work.side)}, depth ${work.depth}</h2>${stop}</div><div>${escape(line)}</div>`
    + bar(work.done, work.total) + rejected);
  const button = document.getElementById("stopScore");
  if (button) button.onclick = () => send("control/job/stop", "score");
}

// A book job, on the books' screen while it runs: its name with Stop (on this machine alone), then
// its pass, a line over its bar; once it ends, how it ended. Drawn at each poll into its own place,
// as Convert's progress.
function drawBookProgress() {
  const section = document.getElementById("bookProgress");
  if (!section) return;
  const slot = state.slot;
  const ended = !slot.running && slot.finished && slot.finished.startsWith("the book of ");
  section.classList.toggle("hidden", !makingBook() && !ended);
  if (ended) {
    redraw(section, `<h2>Last book job</h2><div class="muted">ended: ${escape(slot.finished)}</div>`);
    return;
  }
  if (!makingBook()) return;
  const stopping = slot.stopping;
  const stop = token ? `<button id="stopBook"${stopping ? " disabled" : ""}>${stopping ? "Stopping" : "Stop"}</button>` : "";
  const pass = slot.book;
  // Worded as Convert's places: `{pass}: {done} of {total} ({percent}), {rate}, ETA about {eta}`.
  const said = (pass) => {
    const rate = pass.rate === null ? "" : `, ${bytes(Math.round(pass.rate))}/s`;
    const eta = pass.eta_seconds === null ? "" : `, ETA about ${duration(Math.round(pass.eta_seconds))}`;
    return `${pass.pass}: ${bytes(pass.done)} of ${bytes(pass.total)} (${percent(pass.done / Math.max(1, pass.total))})${rate}${eta}`;
  };
  const line = pass === null ? `<div class="muted">between passes</div>` : `<div>${escape(said(pass))}</div>` + bar(pass.done, pass.total);
  redraw(section, `<div class="row"><h2>Running now: ${escape(slot.holder || "")}</h2>${stop}</div>${line}`);
  const button = document.getElementById("stopBook");
  if (button) button.onclick = () => send("control/job/stop", BOOKS);
}

// A network's config, from its attempt's name, `<config>-a<n>`.
const configOf = (network) => network.attempt.replace(/-a\d+$/, "");
// An attempt's number, so the latest is the highest.
const attemptNumber = (attempt) => Number((attempt.match(/-a(\d+)$/) || [0, 0])[1]);
// Each distinct value of `key` among `list`, in order.
const distinct = (list, key) => [...new Set(list.map(key))];

// The network a cascade's step chooses: at `level` (config, attempt, generation), `value`'s latest attempt,
// then its latest generation, then that generation's winner, or its candidate without one. PeSTO is a
// config of its own.
function cascade(level, value, network) {
  if (value === "pesto") return value;
  const trained = catalog.networks.filter((n) => n.attempt !== null);
  let list = trained.filter((n) => configOf(n) === (level === "config" ? value : configOf(network)));
  const attempt = level === "config" ? Math.max(...list.map((n) => attemptNumber(n.attempt))) : attemptNumber(level === "attempt" ? value : network.attempt);
  list = list.filter((n) => attemptNumber(n.attempt) === attempt);
  const generation = level === "generation" ? Number(value) : Math.max(...list.map((n) => n.generation));
  list = list.filter((n) => n.generation === generation);
  const chosen = list.find((n) => n.winner) || list[0];
  return chosen ? chosen.name : "pesto";
}

// One side's choices, a cascade of short selects: the config (PeSTO among them), its attempt, the attempt's
// generation, each narrowed by the one before, a new choice taking the
// latest winner below it (`cascade`); then its parameters, tuned only where it has a tune.
function sideRow(label, side) {
  // A choice no longer offered (its network gone) falls back to PeSTO, the catalog's first.
  const network = catalog.networks.find((n) => n.name === trialForm[side]) || catalog.networks[0];
  trialForm[side] = network.name;
  const trained = catalog.networks.filter((n) => n.attempt !== null);
  const step = (level, choices) => `<select data-cascade="${side}" data-level="${level}">${choices}</select>`;
  const configs = option("pesto", "PeSTO", network.attempt === null)
    + distinct(trained, configOf).map((c) => option(c, c, network.attempt !== null && configOf(network) === c)).join("");
  let steps = step("config", configs);
  if (network.attempt !== null) {
    const ofConfig = trained.filter((n) => configOf(n) === configOf(network));
    const ofAttempt = ofConfig.filter((n) => n.attempt === network.attempt);
    // No select of the generation's network (the developer, 2026-11-27): a passed generation's winner
    // is its candidate, the same network, and a failed one has its candidate alone, so the generation
    // decides, its winner if it passed (`cascade`), and its label says which.
    const passed = (g) => ofAttempt.some((n) => n.generation === g && n.winner);
    steps += step("attempt", distinct(ofConfig, (n) => n.attempt).map((r) => option(r, `attempt ${attemptNumber(r)}`, r === network.attempt)).join(""))
      + step("generation", distinct(ofAttempt, (n) => n.generation)
        .map((g) => option(String(g), `generation ${g}${passed(g) ? ", passed" : ", candidate"}`, g === network.generation)).join(""));
  }
  // Each suffix offered only when the network has its tunes: `search-tuned` with a search tune,
  // `search-time-tuned` with both.
  const offered = ["untuned"].concat(network.tuned ? ["search-tuned"] : [], network.time_tuned ? ["search-time-tuned"] : []);
  if (!offered.includes(trialForm[side + "Parameters"])) trialForm[side + "Parameters"] = "untuned";
  const parameters = offered.map((suffix) => option(suffix, suffix, trialForm[side + "Parameters"] === suffix)).join("");
  return `<div class="row"><label>${label}</label>${steps}<select data-field="${side}Parameters">${parameters}</select></div>`;
}

// The job's words for the form's trial (`trials::Spec::parse`).
function trialWords() {
  const f = trialForm;
  const settings = f.kind === "match" ? f.pairs.trim() : f.kind === "sprt" ? `${f.elo0.trim()},${f.elo1.trim()}` : "-";
  const limit = f.limit === "depth" ? `depth ${f.depth.trim()}` : `clock ${clockText().text}`;
  // Each side a player, its suffix after its `@`: `untuned`, `search-tuned` or `search-time-tuned`.
  const side = (name) => `${f[name]}@${f[name + "Parameters"]}`;
  return ["--trial", f.kind, settings, side("challenger"), side("champion"), limit];
}

// The trials' screen: New trial (on this machine alone), then the log, newest first.
function trialsScreen() {
  // The challenger, at first, the winner of the latest config's latest attempt's latest generation.
  if (!trialForm.challenger) {
    const configs = distinct(catalog.networks.filter((n) => n.attempt !== null), configOf);
    trialForm.challenger = configs.length > 0 ? cascade("config", configs[configs.length - 1]) : "pesto";
  }
  const f = trialForm;
  const kinds = [["duel", "duel"], ["match", "match"], ["sprt", "SPRT"]].map(([value, label]) => option(value, label, f.kind === value)).join("");
  const settings = f.kind === "match"
    ? `<div class="row"><label>Pairs</label><input data-field="pairs" size="6" value="${escape(f.pairs)}"></div>`
    : f.kind === "sprt"
      ? `<div class="row"><label>Elo</label>elo0 <input data-field="elo0" size="5" value="${escape(f.elo0)}"> elo1 <input data-field="elo1" size="5" value="${escape(f.elo1)}"></div>`
      : `<div class="row"><label></label><span class="muted">arena's rule, per pair: won past 0.5 + 3.09 &times; &sigma; / &radic;P, drawn at 400 pairs (800 games)</span></div>`;
  const number = (field, size) => `<input data-field="${field}" size="${size}" inputmode="decimal" value="${escape(f[field])}">`;
  const clockFields = f.clockKind === "fischer"
    ? `base ${number("base", 5)} s + increment ${number("increment", 4)} s`
    : `${number("moves", 3)} moves in ${number("periodBase", 5)} s + increment ${number("periodIncrement", 4)} s`;
  const presets = `<span class="muted">fill with</span> `
    + CLOCK_PRESETS.map((preset, index) => `<button class="preset" data-clock-preset="${index}">${escape(preset.label)}</button>`)
      .join(` <span class="muted">&middot;</span> `);
  const limit = `<div class="row"><label>Search</label>`
    + `<select data-field="limit">${option("depth", "fixed depth", f.limit === "depth")}${option("clock", "clock", f.limit === "clock")}</select>`
    + (f.limit === "depth" ? `<input data-field="depth" size="4" value="${escape(f.depth)}">` : "")
    + `</div>`
    + (f.limit === "clock"
      ? `<div class="row"><label>Clock</label><select data-field="clockKind">${option("fischer", "Fischer", f.clockKind === "fischer")}`
        + `${option("repeating", "repeating", f.clockKind === "repeating")}</select> ${clockFields}</div>`
        + `<div class="row"><label></label>${presets}</div>`
      : "");
  // As `Spec::mixed`: two different players, tuned differently; one player against itself measures
  // its tune.
  const mixed = f.challengerParameters !== f.championParameters && f.challenger !== f.champion
    ? `<div class="bad">mixed: the two sides tuned differently</div>` : "";
  const form = token
    ? `<section><h2>New trial</h2><form onsubmit="return false">`
      + `<div class="row"><label>Kind</label><select data-field="kind">${kinds}</select></div>${settings}`
      + sideRow("Champion", "champion") + sideRow("Challenger", "challenger") + limit + mixed
      + `<div class="row"><button id="startTrial"${running ? " disabled" : ""}>Start</button><span class="said bad"></span></div>`
      + `</form></section>`
    : "";
  // The log's verdict in a word or two (the developer, 2026-11-27); the trial's own screen keeps the
  // whole sentence. Any other verdict, a stopped trial's or another kind's, as it is.
  const short = (verdict) => verdict === "won by the challenger" ? "challenger wins"
    : verdict === "won by the champion" ? "champion wins" : verdict.startsWith("drawn") ? "draw" : verdict;
  const rows = [...catalog.trials].reverse().map((t) => [
    // A stopped trial, still kept, resumes from its pairs, on this machine: first, where it is seen.
    { html: `<span class="number">${t.number}</span> <button class="plain" data-screen-open="${t.number}">View</button>`
      + `${token && t.verdict.startsWith("stopped") ? ` <button data-resume-trial="${t.number}"${running ? " disabled" : ""}>Resume</button><span class="said bad"></span>` : ""}` },
    local(t.ended),
    trialTitle({ trial: t.kind, settings: t.settings, challenger: t.challenger, champion: t.champion }),
    // The champion's score, not the challenger's (the developer, 2026-11-27).
    t.limit, whole(t.games), t.games > 0 ? percent(1 - t.challenger_points / t.games) : "", (t.mixed ? "mixed; " : "") + short(t.verdict),
  ]);
  const log = rows.length > 0 ? `<div class="log">${table(["trial", "ended", "what", "search", "games", "champion", "verdict"], rows)}</div>` : `<div class="muted">no trial yet</div>`;
  return form + `<section><h2>Trials</h2>${log}<div class="muted">the latest 20 are kept, each with its games; a stopped one may be resumed while it is kept</div></section>`;
}

// A trial's own screen, `#trials/<number>`: while it plays, its live card alone (`drawLive`); else the
// same card from its record, its log line, and Resume for a stopped one.
function trialScreen() {
  if (jobHere()) return "";
  const t = catalog.trials.find((trial) => String(trial.number) === currentAttempt);
  if (!t) return running ? "" : `<section class="muted">trial ${escape(currentAttempt)} is not kept</section>`;
  const view = { trial: t.kind, settings: t.settings, challenger: t.challenger, champion: t.champion };
  const resume = token && t.verdict.startsWith("stopped")
    ? `<div class="row"><button data-resume-trial="${t.number}"${running ? " disabled" : ""}>Resume</button><span class="said bad"></span></div>` : "";
  // Its block as it played, rebuilt from its record, then its dates and Resume.
  if (t.view) {
    return `<section>${work(t.view)}</section>`
      + `<section><div class="muted">started ${escape(local(t.started))}, ended ${escape(local(t.ended))}</div>`
      // A stopped trial has no verdict in its block: its stop is said here.
      + (t.verdict.startsWith("stopped") ? `<div><b>stopped</b></div>` : "") + `${resume}</section>`;
  }
  const score = t.games > 0 ? `, the champion ${percent(1 - t.challenger_points / t.games)}` : "";
  return `<section><h2>${escape(trialTitle(view))}</h2><div class="muted">${escape(t.limit)}; started ${escape(local(t.started))}, ended ${escape(local(t.ended))}</div>`
    + (t.mixed ? `<div class="bad">mixed: the two sides tuned differently</div>` : "")
    + `<div>${whole(t.games)} games${score}</div><div><b>${escape(t.verdict)}</b></div>${resume}</section>`;
}

// The New trial form's fields write their choice into `trialForm`; a change that alters the form redraws it.
function bindTrialForm(element) {
  element.querySelectorAll("[data-field]").forEach((field) => {
    field.oninput = field.onchange = () => {
      const redraw = field.tagName === "SELECT";
      trialForm[field.dataset.field] = field.value;
      if (redraw) {
        catalogDrawn = "";
        drawConfig();
      }
    };
  });
  // A side's cascade: each step chooses the network anew (`cascade`), and the form is redrawn.
  element.querySelectorAll("[data-cascade]").forEach((select) => {
    select.onchange = () => {
      const side = select.dataset.cascade;
      const network = catalog.networks.find((n) => n.name === trialForm[side]);
      trialForm[side] = cascade(select.dataset.level, select.value, network);
      catalogDrawn = "";
      drawConfig();
    };
  });
  // A clock preset fills the clock's fields, and the form is redrawn with them.
  element.querySelectorAll("[data-clock-preset]").forEach((preset) => {
    preset.onclick = () => {
      const { label, ...fields } = CLOCK_PRESETS[Number(preset.dataset.clockPreset)];
      Object.assign(trialForm, fields);
      catalogDrawn = "";
      drawConfig();
    };
  });
  const button = document.getElementById("startTrial");
  // A new trial's number is known once it plays: its screen opens then (`draw`). A clock its fields
  // do not make is refused here, beside the button: the smithy passes the clock's text on unread.
  if (button) button.onclick = () => {
    const clock = trialForm.limit === "clock" ? clockText() : {};
    if (clock.error) {
      button.parentElement.querySelector(".said").textContent = clock.error;
      return;
    }
    pendingTrial = true;
    start(trialWords(), button);
  };
  element.querySelectorAll("[data-resume-trial]").forEach((resume) => {
    resume.dataset.screen = resume.dataset.resumeTrial;
    resume.onclick = () => start(["--resume-trial",resume.dataset.resumeTrial], resume);
  });
}

// An attempt's screen below its job and its view: Resume when no job runs; a tune's, only that it is
// not running; while another job runs, that it does.
function attemptScreen() {
  if (jobHere()) return "";
  if (running) return `<section class="muted">${escape(state.job)} is running: no other attempt is viewed meanwhile</section>`;
  const config = catalog.configs.find((c) => c.name === current);
  const attempt = config && config.attempts.find((r) => r.name === currentAttempt);
  if (!attempt) {
