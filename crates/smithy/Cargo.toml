# Everything that touches tensors and training data: the training server (`server start --forge`),
# and `lc0`. The one crate that needs libtorch.
[package]
name = "smithy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fattorini.workspace = true
pgn-replay.workspace = true
progress.workspace = true
# The claim, the work, the page and the control, over HTTP with the arenas (`smithy.rs`).
lan-http.workspace = true
ctrlc.workspace = true
# `smithy start`'s events, on stdout (`progress::log_events`); its progress is the page's alone.
log.workspace = true
pgn-reader.workspace = true
rand.workspace = true
serde.workspace = true
serde_yaml.workspace = true
# The smithy's status page polls its state as JSON (`smithy.rs`, `/state.json`).
serde_json.workspace = true
time.workspace = true
# Compresses the feature cache files (`cache.rs`, `framed.rs`).
zstd.workspace = true
# Gunzips Lc0's training games (`lc0/`).
flate2.workspace = true
# Replays Lc0's games to write them as PGN, checking every board (`lc0/convert.rs`).
shakmaty.workspace = true
# `tch`'s build script (`torch-sys`) searches for a real `libtorch` install at build time. Only this
# crate depends on it, so `fattorini` and `arena` never need `libtorch` to build.
tch = "0.24"
# The global allocator, as the arena's (`main.rs`): the bench every clocked test and tune scales the
# arenas' clocks by (`loaded_bench`) allocates on half the cores at once, and under Windows' system
# heap it read about a third below the arena's on the same idle machine (2026-11-13: 732,000 nodes
# per second per thread against the arena's 1,097,000), so every arena's clock was scaled down.
mimalloc = "0.1.52"

[lints]
workspace = true

[[bin]]
name = "smithy"
path = "src/main.rs"
bench = false
